# nivo-lite on Netlify (standalone Next.js app; the Next.js runtime is declared below so Git builds and CLI builds match).
# The repository is a monorepo: the web app is the workspace fe/apps/web. Netlify installs at the root and builds that workspace.
[build]
  base = "."
  command = "npm run build -w @nivo-lite/web"
  publish = "fe/apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Git builds do not add the Next.js runtime on their own (the CLI does); without it no server function is deployed and every page 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
