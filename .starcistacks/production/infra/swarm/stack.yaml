# NIVO production stack for ONE Ubuntu VPS: a single-manager Docker Swarm (canon docs/application-stacks.md, "Docker Swarm on a VPS").
# This file is the SOURCE of the review model. A release renders it with `docker stack config` (deploy/swarm/render.mjs) together with the
# generated override that adds the versioned secret grants and the `<KEY>_FILE` pointers, and deploys the rendered bytes with
# `docker stack deploy --with-registry-auth nivo`. Nothing here is built on the VPS and no secret value appears in it.
#
# Topology (only `ingress` publishes ports):
#   ingress   Traefik: 80/443 in HOST mode (the real client address reaches the api rate limiter), TLS for nivo.vn, www.nivo.vn, api.nivo.vn
#   web       the Next.js app, reached as nivo-web:3000 on the edge network
#   api       the Nest api: GraphQL, webhooks, the pgmq workers, the job alert monitor; reached as nivo-api:8787 on the edge network
#   openclaw  the agent gateway; the api reaches it by service DNS (openclaw:18790) on the private `agents` network
#   n8n       private automation editor on the `automation` network (no published port); SQLite database on the persisted volume n8n-data
#
# Health signals: the container healthcheck is LIVENESS only (process-local /healthz; a Supabase outage never restarts the api). READINESS
# (/readyz: the database answers) gates traffic at the ingress (Traefik health check in routes.yml) and the deploy acceptance, never a restart.
# Stateful services update stop-first (one writer per volume); stateless ones start-first with rollback on failure.

x-logging:
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  ingress:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    command:
      - --providers.file.filename=/etc/traefik/routes.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certResolver=le
      - --entrypoints.web.forwardedHeaders.insecure=false
      - --entrypoints.websecure.forwardedHeaders.insecure=false
      - --certificatesResolvers.le.acme.storage=/acme/acme.json
      - --certificatesResolvers.le.acme.httpChallenge.entryPoint=web
      - --certificatesResolvers.le.acme.email=${ACME_EMAIL:-}
      - --api.dashboard=false
      - --ping=true
      - --ping.entryPoint=ping
      - --entrypoints.ping.address=127.0.0.1:8082
      - --accesslog=true
      - --accesslog.bufferingsize=100
      - --accesslog.fields.headers.defaultmode=drop
      - --log.level=INFO
      - --global.sendanonymoususage=false
    ports:
      - { target: 80, published: 80, protocol: tcp, mode: host }
      - { target: 443, published: 443, protocol: tcp, mode: host }
    configs:
      - { source: routes, target: /etc/traefik/routes.yml, mode: 0444 }
    volumes:
      - acme:/acme
    networks: [edge]
    healthcheck:
      test:
        [
          "CMD",
          "traefik",
          "healthcheck",
          "--ping",
          "--ping.entryPoint=ping",
          "--entrypoints.ping.address=127.0.0.1:8082",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      resources: { limits: { memory: 128M } }
      # Host-mode ports cannot be bound by two tasks: the ingress is the one stop-first service that is not a data store.
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback, monitor: 30s, max_failure_ratio: 0 }
      rollback_config: { parallelism: 1, order: stop-first, monitor: 30s }
      restart_policy: { condition: any, delay: 5s }

  web:
    image: ${NIVO_WEB_IMAGE:?set NIVO_WEB_IMAGE to the registry reference with an @sha256 digest}
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=512
    networks:
      edge:
        aliases: [nivo-web]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      replicas: 1
      resources: { limits: { memory: 600M } }
      update_config:
        { parallelism: 1, order: start-first, failure_action: rollback, monitor: 30s, max_failure_ratio: 0, delay: 5s }
      rollback_config: { parallelism: 1, order: start-first, monitor: 30s }
      restart_policy: { condition: any, delay: 5s }

  api:
    image: ${NIVO_API_IMAGE:?set NIVO_API_IMAGE to the registry reference with an @sha256 digest}
    # environment, `<KEY>_FILE` pointers and the versioned secret grants are added by the generated override (render.mjs).
    networks:
      edge:
        aliases: [nivo-api]
      agents:
      automation:
    volumes:
      - openclaw-data:/openclaw-state
      - video-cache:/var/cache/nivo-video # voiceover clips by text hash: re-rendering the same script costs no TTS call
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PORT+'/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 45s # running jobs finish or are handed back to the queue before the task stops
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      replicas: 1
      # openclaw-data and video-cache are single-host volumes: the placement is explicit, a replica is not high availability.
      placement: { constraints: [node.role == manager] }
      update_config:
        { parallelism: 1, order: start-first, failure_action: rollback, monitor: 45s, max_failure_ratio: 0, delay: 5s }
      rollback_config: { parallelism: 1, order: start-first, monitor: 45s }
      restart_policy: { condition: any, delay: 5s }

  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.7.1@sha256:6a31d44b2944e7adcd2b582bf6fb463111264ebca97a0201795b799135bd102c
    # The image has no `_FILE` support: the wrapper exports the gateway token and provider keys from /run/secrets into the gateway process only,
    # merges the gateway settings into openclaw.json, and starts the relay that lets the api reach the loopback-only gateway (see the wrapper).
    entrypoint: ["tini", "-s", "--", "sh", "/opt/nivo/entrypoint.sh"]
    environment:
      OPENCLAW_RELAY_PORT: "18790"
    configs:
      - { source: openclaw-entrypoint, target: /opt/nivo/entrypoint.sh, mode: 0555 }
      - { source: openclaw-init, target: /opt/nivo/openclaw-init.mjs, mode: 0444 }
      - { source: openclaw-relay, target: /opt/nivo/openclaw-relay.mjs, mode: 0444 }
    volumes:
      - openclaw-data:/home/node/.openclaw
    networks: [agents]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18790/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback, monitor: 45s, max_failure_ratio: 0 }
      rollback_config: { parallelism: 1, order: stop-first, monitor: 45s }
      restart_policy: { condition: any, delay: 5s }

  n8n:
    # Upgrade deliberately: n8n migrates its SQLite database on start and a migrated database cannot go back (back up the n8n-data volume first: deploy/swarm/backup.sh).
    image: docker.n8n.io/n8nio/n8n:1.64.3@sha256:4d9116228d426ce24c442a744e9c11ee7c1187713f93f21dd5a34a12584708c1
    environment:
      DB_TYPE: sqlite # owner ruling 2026-10-14: no self-hosted Postgres; database.sqlite lives on the persisted volume n8n-data (/home/node/.n8n)
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/N8N_ENCRYPTION_KEY
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [automation]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      update_config: { parallelism: 1, order: stop-first, failure_action: rollback, monitor: 45s, max_failure_ratio: 0 }
      rollback_config: { parallelism: 1, order: stop-first, monitor: 45s }
      restart_policy: { condition: any, delay: 5s }

networks:
  # nivo-edge-swarm is attachable so a standalone container of another product that shares this ingress (namnivo-web) can join it.
  edge: { driver: overlay, attachable: true, name: nivo-edge-swarm }
  # agents and automation are attachable for the operator tunnels only (deploy/swarm/vps.sh tunnel); no port is ever published.
  agents: { driver: overlay, attachable: true }
  automation: { driver: overlay, attachable: true }

# The volumes keep the names the compose projects gave them (nivo-engine_*, nivo-edge_acme): the data and the certificates survive the move to
# Swarm, and the old compose stack can start again on them for a rollback. `vps.sh prepare` creates any that is missing on a fresh host.
volumes:
  openclaw-data: { external: true, name: nivo-engine_openclaw-data }
  video-cache: { external: true, name: nivo-engine_video-cache }
  n8n-data: { external: true, name: nivo-engine_n8n-data }
  acme: { external: true, name: nivo-edge_acme }

# Config objects are immutable and versioned by content: provision.mjs creates `nivo-<name>-c<digest>` and the render passes the names in.
configs:
  routes: { external: true, name: "${NIVO_CFG_ROUTES:?}" }
  openclaw-entrypoint: { external: true, name: "${NIVO_CFG_OPENCLAW_ENTRYPOINT:?}" }
  openclaw-init: { external: true, name: "${NIVO_CFG_OPENCLAW_INIT:?}" }
  openclaw-relay: { external: true, name: "${NIVO_CFG_OPENCLAW_RELAY:?}" }
