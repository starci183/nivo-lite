# Non-secret production configuration of the api (committed; compose `env_file` reads it before the generated api.env of secret pointers).
# A key listed here must NOT also be sealed. Secrets never go in this file: they live in .starcistacks/production/secrets/*.enc.
# The console and browser return pages are served on app.nivo.vn, the landing on nivo.vn / www.nivo.vn, and the API on api.nivo.vn.
# CORS allows all three browser origins. Webhooks configured with the old https://nivo.vn/api/... URLs keep working through the edge.
PRIMARY_DB_SCHEMA=public
SITE_URL=https://app.nivo.vn
PUBLIC_SITE_URL=https://app.nivo.vn
PUBLIC_API_URL=https://api.nivo.vn
HTTP_SECURITY_ALLOWED_ORIGINS=https://app.nivo.vn,https://nivo.vn,https://www.nivo.vn
N8N_WEBHOOK_BASE=http://nivo-n8n:5678/webhook/nivo-events
AUTH_WEB_ORIGIN=https://app.nivo.vn
AUTH_GOOGLE_CALLBACK_URL=https://api.nivo.vn/auth/google/callback
STORAGE_ENDPOINT=http://academy-minio:9000
STORAGE_PUBLIC_URL=https://minio.starci.org
STORAGE_BUCKET_PREFIX=nivo
