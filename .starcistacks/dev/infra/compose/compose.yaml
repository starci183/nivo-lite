# The dev environment's dependencies of NIVO, run by `starci app stack up --env dev --execute` (PROJECT-STACKS-3, PROJECT-STACKS-6); nobody runs
# docker by hand. Host ports come from environments.dev.local.ports through STACK_PORT_<NAME>; every credential is read from a file through the
# least grant of its service (STACK_GRANT_<NAME>, a directory holding only that service's keys), never from the environment; the agent workspace
# is STACK_DATA_DIR. Service names are the component ids of the manifest. Every port publishes on loopback
# only. The api, the mcp gateway, the console and the landing run natively against these containers.
name: nivo-lite-dev
services:
  db:
    build:
      context: ../../../images/db
    image: nivo-lite-db:stack-dev
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:${STACK_PORT_DB}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ${STACK_GRANT_DB}:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  nivo-redis:
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    # The api refuses a Redis that may evict jobs (platform/queue isQueueMemoryBounded): bounded like production, noeviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${STACK_PORT_REDIS}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nivo-qdrant:
    # The vector index: one point per Postgres row, rebuilt from Postgres by the reconcile job, so the volume is a cache of a projection.
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    # The API key is read from the granted file, never from the environment of the compose project; a backtick substitution keeps the
    # shell substitution out of the compose interpolation. A boot without the file fails instead of serving an open index.
    command: ["sh", "-c", "QDRANT__SERVICE__API_KEY=\"`cat /run/secrets/QDRANT_API_KEY`\" exec ./entrypoint.sh"]
    ports:
      - "127.0.0.1:${STACK_PORT_QDRANT}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
      - ${STACK_GRANT_QDRANT}:/run/secrets:ro
    healthcheck:
      # The image ships no HTTP client: the check is that the REST port accepts a connection. Readiness proper (the collections exist
      # with the right vector size) is the app's own boot check and its /readyz `vectors` member.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  nivo-minio:
    # The StarCi source-built MinIO fork (harness images/sources.json "minio"), pinned by digest (BE-SERVICES-2).
    image: ghcr.io/starci183/minio:RELEASE.2025-10-15T17-29-55Z-starci.1@sha256:ec6dfba54eaa8e0d77bed9e7c6d86df90ad341f914ecfd3d613f0f811155f40f
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/STORAGE_ACCESS_KEY
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/STORAGE_SECRET_KEY
    ports:
      - "127.0.0.1:${STACK_PORT_MINIO}:9000"
    volumes:
      - minio-data:/data
      - ${STACK_GRANT_MINIO}:/run/secrets:ro
    restart: unless-stopped

volumes:
  db-data: {}
  redis-data: {}
  qdrant-data: {}
  minio-data: {}

