schema: starci/seeds@1
entries:
  - id: nivo-workspace
    kind: data
    path: data/nivo-workspace.json
    target: [node, be/dist/apps/cli/src/main.js, seed-management]
    mode: upsert
    schema: be/src/modules/domain/channel-provisioning/management-seed.schema.json
  - id: agent-graphs
    kind: data
    path: data/graphs
    target: [node, be/dist/apps/cli/src/main.js, seed-agent-graphs, --workspace, NIVO]
    mode: upsert
    after: [nivo-workspace]
    schema: be/src/modules/domain/agent-graphs/agent-graph-spec.schema.json
  - id: test-accounts
    kind: test-account
    path: data/test-accounts.json
    target: [node, be/dist/apps/cli/src/main.js, seed-test-accounts]
    mode: upsert
    after: [nivo-workspace]
    schema: be/src/modules/domain/channel-provisioning/test-accounts-seed.schema.json
    reason: The sign-ins the dev stack is tested with (owner and staff of the NIVO workspace and of the demo workspace, @example.test addresses); their addresses and passwords are sealed in seeds-test-accounts, never typed.
  - id: catalogue
    kind: data
    path: data/catalogue.json
    target: [node, be/dist/apps/cli/src/main.js, seed-catalogue, --workspace, NIVO]
    mode: upsert
    after: [nivo-workspace]
    schema: be/src/modules/domain/channel-provisioning/catalogue-seed.schema.json
  - id: brain-tiem-hoa
    kind: data
    path: data/brain-tiem-hoa.json
    target: [node, be/dist/apps/cli/src/main.js, seed-brain, --workspace, NIVO]
    mode: upsert
    after: [nivo-workspace]
    schema: be/src/modules/domain/channel-provisioning/brain-seed.schema.json
    reason: The demo shop "Tiệm hoa Nắng Mai" (a fictional business, no real address, phone or person) for the real flow F walk; four public documents (introduction and hours, products and prices, delivery, payment and returns) and two internal ones (order handling, replying and the discount limit) are kept as knowledge sources and indexed like any document.
  - id: records-tiem-hoa
    kind: data
    path: data/records-tiem-hoa.json
    target: [node, be/dist/apps/cli/src/main.js, seed-records, --workspace, NIVO]
    mode: upsert
    after: [nivo-workspace]
    schema: be/src/modules/domain/channel-provisioning/records-seed.schema.json
    reason: The Sales rules of the demo shop written through the entity engine (maxDiscountPct 10 and the 5.000.000 VND owner threshold), so the internal Brain document about the discount limit and the setting cannot drift.
