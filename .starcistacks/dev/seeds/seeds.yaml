schema: starci/seeds@1
entries:
  - id: nivo-workspace
    kind: data
    path: data/nivo-workspace.json
    target: [node, be/dist/apps/cli/src/main.js, seed-management]
    mode: upsert
    schema: be/src/modules/domain/channel-provisioning/management-seed.schema.json
  - id: agent-graphs
    kind: data
    path: data/graphs
    target: [node, be/dist/apps/cli/src/main.js, seed-agent-graphs, --workspace, NIVO]
    mode: upsert
    after: [nivo-workspace]
    schema: be/src/modules/domain/agent-graphs/agent-graph-spec.schema.json
  - id: test-accounts
    kind: test-account
    path: data/test-accounts.json
    target: [node, be/dist/apps/cli/src/main.js, seed-test-accounts]
    mode: upsert
    after: [nivo-workspace]
    schema: be/src/modules/domain/channel-provisioning/test-accounts-seed.schema.json
    reason: The sign-ins the dev stack is tested with (owner and staff of the NIVO workspace and of the demo workspace, @example.test addresses); their addresses and passwords are sealed in seeds-test-accounts, never typed.
  # The demo shop "Tiệm hoa Nắng Mai" (a fictional business, no real address, phone or person) for the real flow F walk; five public documents (introduction and hours, the flowers on sale, products and prices, delivery, payment and returns) and two internal ones (order handling, replying and the discount limit) are kept as knowledge sources and indexed like any document.
  - id: brain-tiem-hoa
    kind: data
    path: data/brain-tiem-hoa.json
    target: [node, be/dist/apps/cli/src/main.js, seed-brain, --workspace, NIVO]
    mode: upsert
    after: [nivo-workspace]
    schema: be/src/modules/domain/channel-provisioning/brain-seed.schema.json
  # The Sales rules of the demo shop written through the entity engine (maxDiscountPct 10 and the 5.000.000 VND owner threshold), so the internal Brain document about the discount limit and the setting cannot drift.
  - id: records-tiem-hoa
    kind: data
    path: data/records-tiem-hoa.json
    target: [node, be/dist/apps/cli/src/main.js, seed-records, --workspace, NIVO]
    mode: upsert
    after: [nivo-workspace, agent-graphs]
    schema: be/src/modules/domain/channel-provisioning/records-seed.schema.json
  # The team chat of the demo shop: three group rooms (the whole shop, sales, bookkeeping) with a few lines each, among them an order notice card and a reply waiting for the owner's approval. Rooms and lines keep stable ids, so a rerun adds nothing; people are found by role and agents by module.
  - id: chat-tiem-hoa
    kind: data
    path: data/chat-tiem-hoa.json
    target: [node, be/dist/apps/cli/src/main.js, seed-chat, --workspace, NIVO]
    mode: upsert
    after: [nivo-workspace, agent-graphs, test-accounts]
    schema: be/src/modules/domain/channel-provisioning/chat-seed.schema.json
  # The enterprise workspaces, FOUNDATION only (the workspace, its string identifier, its owner): one document per enterprise under
  # data/enterprises/, nivo-web first. Each document's `target` (off | local | prod | both; this level is local) is read on every
  # run, and a change of it changes the content hash, so `upsert` reruns the command; off seeds nothing. Usage data (the CRM import of
  # customer files, conversations, runs, documents) is never seeded. Taking an enterprise off the local stack is `seed-enterprise remove`, by hand.
  - id: enterprises
    kind: data
    path: data/enterprises
    target: [node, be/dist/apps/cli/src/main.js, seed-enterprise, run, --env, dev]
    mode: upsert
    after: [nivo-workspace, test-accounts]
    schema: be/src/modules/domain/channel-provisioning/enterprise-seed.schema.json
