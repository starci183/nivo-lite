# NIVO local development: the be and the fe in containers, against the local Supabase (supabase start; it is a Supabase CLI stack, not part of
# this file). Run from the repository root:  docker compose -f .starcistacks/dev/compose.yaml up --build
# The api reads its environment from the untracked .starcistacks/dev/api.dev.env that .starcistacks/dev/README.md `prepare` writes from `supabase status -o env`
# (local demo credentials only; the file is ignored by the stacks custody rules). Production does not use this file: see ../../../production.
name: nivo-dev

services:
  api:
    build:
      context: ../..
      dockerfile: be/apps/api/Dockerfile
    image: nivo-lite/api:dev
    env_file:
      - api.dev.env
    environment:
      PORT: "8787"
      PRIMARY_DB_SCHEMA: public
      SITE_URL: http://localhost:3000
      HTTP_SECURITY_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      QUEUE_ENABLED: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ../..
      dockerfile: fe/apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?export the local anon key (supabase status -o env)}
        NEXT_PUBLIC_API_URL: http://localhost:8787
        NEXT_PUBLIC_DEVELOPER_API_URL: http://localhost:8787
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    image: nivo-lite/web:dev
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
