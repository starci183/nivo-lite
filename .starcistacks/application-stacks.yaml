    minAgeHours: 48
k8s:
  status: deferred
  reason: Whole-package Kubernetes deployment is deferred; production is a single-manager Docker Swarm on one VPS, and dev uses a local Docker Swarm with Supabase CLI backing.
# Ownership is declared here; this does not provision Sonar or change the conditional CI scan.
services:
  #   container-registry:
  #     provider: ghcr
  #     mode: hosted
  #     purpose: The api and web images of every release, pushed by the stack-deploy workflow; the Swarm deploy pulls them by digest with --with-registry-auth.
  #     host:
  #       public: https://ghcr.io
  #     auth: github-token
  #     projects:
  #       - {repository: nivo-lite, key: ghcr.io/starci183/nivo-lite-api}
  #       - {repository: nivo-lite, key: ghcr.io/starci183/nivo-lite-web}
  #     ci:
  #       workflow: .github/workflows/stack-deploy.yml
  #       wiring: required
  #       permissions: ['packages: write']
  #       secrets: []
  #       vars: []
  #       provisioning: >-
  #         docker/login-action with the automatic GITHUB_TOKEN of the workflow; nothing is stored. The packages are private. The deploy job passes the same short-lived
  #         token to the Swarm manager with docker stack deploy --with-registry-auth (packages: write on the build, packages: read on a rollback).
  #     ownerAction: none
  sonar:
    provider: sonarqube
    mode: local
    purpose: Static analysis and the quality gate; CI scans on release tags when the project token exists.
    host:
      local: http://localhost:9010
      public: https://sonar.starci.org
    stack:
      owner: host
      root: .claude/ext/sonar
      environment: dev
      compose: compose.yaml
      container: starci-sonarqube
      publishedBy: cloudflared.yaml
    auth: token
    qualityGate: starci-quality-lite
    projects:
      - { repository: nivo-lite, key: nivo-lite }
    ci:
      workflow: .github/workflows/ci.yml
      wiring: optional-follow-up
      secrets: []
      vars:
        - { name: SONAR_HOST_URL, value: https://sonar.starci.org }
      provisioning: >-
        ci.yml scans on release tags only when SONAR_TOKEN exists. The host owns Sonar provisioning and token custody;
        declaring its ownership here does not create credentials or enable scanning.
    ownerAction: none
