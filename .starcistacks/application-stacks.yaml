  postCutover:
    schema: public
    functionNames: [job_schedule]
    minAgeHours: 48
k8s:
  status: deferred
  reason: Whole-package Kubernetes deployment is deferred; production is a single-manager Docker Swarm on one VPS, and dev uses a local Docker Swarm over local backing containers.
# Ownership is declared here; this does not provision Sonar or change the conditional CI scan.
services:
  #   container-registry:
  #     provider: ghcr
  #     mode: hosted
  #     purpose: The api, web and landing images of every release, pushed by the stack-deploy workflow; the Swarm deploy pulls them by digest with --with-registry-auth.
  #     host:
  #       public: https://ghcr.io
  #     auth: github-token
  #     projects:
  #       - {repository: nivo-lite, key: ghcr.io/starci183/nivo-lite-api}
  #       - {repository: nivo-lite, key: ghcr.io/starci183/nivo-lite-web}
  #       - {repository: nivo-lite, key: ghcr.io/starci183/nivo-lite-landing}
  #     ci:
  #       workflow: .github/workflows/stack-deploy.yml
  #       wiring: required
  #       permissions: ['packages: write']
  #       secrets: []
  #       vars: []
  #       provisioning: >-
  #         docker/login-action with the automatic GITHUB_TOKEN of the workflow; nothing is stored. The packages are private. The deploy job passes the same short-lived
  #         token to the Swarm manager with docker stack deploy --with-registry-auth (packages: write on the build, packages: read on a rollback).
  #     ownerAction: none
  sonar:
    provider: sonarqube
    mode: local
    purpose: Static analysis and the quality gate; CI scans on release tags when the project token exists.
    host:
      local: http://localhost:9010
      public: https://sonar.starci.org
    stack:
      owner: host
      root: .claude/ext/sonar
      environment: dev
      compose: compose.yaml
      container: starci-sonarqube
      publishedBy: cloudflared.yaml
    auth: token
    qualityGate: starci-quality-lite
    credentials:
      - id: analysis
        project: nivo-lite
        key: SONAR_TOKEN
        custody: {repository: nivo-lite, path: .starcistacks/dev/secrets/sonar.enc.yaml}
    projects:
      - {repository: nivo-lite, key: nivo-lite}
    ci:
      workflow: .github/workflows/ci.yml
      wiring: required
      token: SONAR_TOKEN
      hostVar: SONAR_HOST_URL
      secrets: [{name: SONAR_TOKEN, credential: analysis}]
      provisioning: >-
        ci.yml scans release tags on sonar.starci.org with the repository secret SONAR_TOKEN and the repository variable SONAR_HOST_URL (both declared in the top-level ci block). The host owns the Sonar server; the owner creates the nivo-lite project token.
    ownerAction:
      needed: the nivo-lite project token from sonar.starci.org as the repository secret SONAR_TOKEN (starci app ci secret set SONAR_TOKEN).
      reason: the token is a credential only the owner can mint on the host Sonar server.
  codecov:
    provider: codecov
    mode: hosted
    purpose: Coverage uploads of be/coverage/lcov.info on release tags, authenticated with GitHub OIDC.
    host: {public: https://codecov.io}
    auth: oidc
    target: 100
    components: auto
    required: true
    ci:
      workflow: .github/workflows/ci.yml
      wiring: required
      provisioning: The test job holds id-token write; codecov-action uses OIDC, so no repository token is needed (CODECOV_TOKEN stays an optional fallback).
    ownerAction: none
  dependabot:
    provider: github
    mode: hosted
    purpose: Weekly dependency updates with grouped minor and patch releases, separate majors and immediate security updates; @starci packages move only through starci npm install.
    ecosystems: [npm, github-actions, docker]
    schedule: {interval: weekly}
    groups: {minorPatch: grouped, major: per-package}
    ignore: ['@starci/*']
    security: immediate
    ownerAction: none
  audit:
    provider: npm
    mode: local
    purpose: Production dependency vulnerability checks in the release gate and CI.
    level: high
    omitDev: true
    in: [release-gate, ci]
    ownerAction: none
