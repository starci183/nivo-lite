          app: landing
          buildArgs:
            values: {NEXT_PUBLIC_SITE_URL: "https://nivo.vn", NEXT_PUBLIC_APP_URL: "https://app.nivo.vn"}
      volumes: [nivo-engine_video-cache, nivo-engine_n8n-data, nivo-engine_redis-data, nivo-engine_qdrant-data, nivo-engine_ai-router-data, nivo-engine_postgres-data, nivo-engine_postgres-backups, nivo-edge_acme]
      secrets:
        grants:
          - service: nivo-api
            filePointers: true
            from:
              - {member: nivo}
              - {member: mail}
              - {member: telegram}
              - {member: sepay}
              - {member: postgres}
              - {member: redis}
              - {member: qdrant}
              - {member: auth}
              - {member: google}
              - {member: storage}
              - {member: ai}
              - {member: test-accounts, keys: [WORKSPACE_SEED_INPUT]}
              - {member: n8n, keys: [N8N_SIGNING_SECRET]}
          # Redis starts with --requirepass from /run/secrets/QUEUE_REDIS_PASSWORD, so a boot without it fails instead of serving an open broker.
          - service: nivo-redis
            from:
              - {member: redis, keys: [QUEUE_REDIS_PASSWORD], required: true}
          # Qdrant starts with its API key read from /run/secrets/QDRANT_API_KEY, so a boot without it fails instead of serving an open index.
          - service: nivo-qdrant
            from:
              - {member: qdrant, keys: [QDRANT_API_KEY], required: true}
          # The gateway gets exactly the keys it needs (be/apps/mcp/src/mcp.env.ts): the database connection, CHANNEL_TOKEN_KEY and ENTITY_ENGINE_CURSOR_KEY.
          - service: nivo-mcp
            filePointers: true
            from:
              - {member: postgres, keys: [PRIMARY_DB_URL], required: true}
              - {member: nivo, keys: [CHANNEL_TOKEN_KEY, ENTITY_ENGINE_CURSOR_KEY], required: true}
              - {member: qdrant, keys: [QDRANT_API_KEY], required: true}
          # APP_BE_DB_PASSWORD reaches db too: its init script gives the app_be login role that password when the cluster is first created.
          - service: db
            filePointers: true
            from:
              - {member: postgres, keys: [POSTGRES_PASSWORD, APP_BE_DB_PASSWORD], required: true}
          - service: nivo-postgres-backup
            from:
              - {member: postgres, keys: [POSTGRES_PASSWORD], required: true}
          - service: nivo-n8n
            filePointers: true
            from:
              - {member: n8n, keys: [N8N_ENCRYPTION_KEY], required: true}
        settings: [{member: n8n, keys: [N8N_ALLOWED_HOSTS]}] # UNVERIFIED shape: the old form took one member; JOBS_* were never sealed (defaults apply)
      environment:
        nivo-api:
          files: [infra/swarm/api-public.conf]
          values:
            PORT: "8787"
            QUEUE_ENABLED: "true"
            QUEUE_REDIS_HOST: nivo-redis
            QUEUE_REDIS_PORT: "6379"
            QUEUE_REDIS_PREFIX: nivo
            REALTIME_HUB: redis
            REALTIME_REDIS_PREFIX: nivo-realtime
            # The vector index (Qdrant) on the private agents network; QDRANT_API_KEY comes from the sealed qdrant member. This address is
            # REQUIRED: the only home of vectors (the api refuses to start without it; /readyz is unready while it does not answer).
            QDRANT_URL: "http://nivo-qdrant:6333"
            # the in-process AI gateway (declared port above); ANTHROPIC_API_KEY (chat), OPENAI_API_KEY (embeddings) and STARCI_AI_KEY come
            # from the sealed ai member; OPENROUTER_API_KEY stays sealed there but the pool no longer reads it (owner 2026-11-11)
            AI_ROUTER_PORT: "8788"
            AI_ROUTER_KEYS_PATH: /var/lib/ai-router/keys.sqlite
            AI_BASE_URL: "http://127.0.0.1:8788/v1"
            AI_CHAT_MODEL: work
            AI_EMBEDDING_MODEL: embed-oa
          settings:
            N8N_ALLOWED_HOSTS: {key: N8N_ALLOWED_HOSTS, default: nivo-n8n}
            JOBS_ALERT_FAILED_MAX: {key: JOBS_FAILED_ALERT, default: "20"}
            JOBS_ALERT_STALE_SECONDS: {key: JOBS_STALE_SECONDS, default: "300"}
        nivo-mcp:
          values:
            PORT: "8790"
            PRIMARY_DB_SCHEMA: public
            # The OriginGuard and CORS allowlist of the gateway; it has no browser caller, so only the console origin is listed.
            HTTP_SECURITY_ALLOWED_ORIGINS: "https://app.nivo.vn"
            QDRANT_URL: "http://nivo-qdrant:6333"
      configs:
        - {name: postgres-backup, file: infra/swarm/postgres/backup.sh, env: NIVO_CFG_POSTGRES_BACKUP}
      verify:
        http:
          - {name: api liveness, url: "https://api.nivo.vn/healthz", status: 200, json: {status: ok}, retry: true}
          - {name: api readiness, url: "https://api.nivo.vn/readyz", status: 200, retry: true}
          - {name: api graphql, url: "https://api.nivo.vn/graphql", method: POST, body: '{"query":"{__typename}"}', status: 200, contains: __typename, retry: true}
          - {name: landing health on the apex, url: "https://nivo.vn/health/live", status: 200, retry: true}
          - {name: landing health on www, url: "https://www.nivo.vn/health/live", status: 200, retry: true}
          - {name: console health on app, url: "https://app.nivo.vn/health/live", status: 200, retry: true}
          - {name: legacy webhook path reaches the api, url: "https://nivo.vn/healthz", status: 200, retry: true}
        exec:
          - name: jobs watchdog prints two non-negative integers
            service: nivo-api
            command: [node, be/dist/apps/cli/src/main.js, jobs, watchdog]
            stdout: '^\d+ \d+\r?\n?$'
          # The stack has no post-deploy task hook, so the deploy syncs the module catalogue here: `ensure` upserts it and prints the count.
          - name: catalogue synced
            service: nivo-api
            command: [node, be/dist/apps/cli/src/main.js, seed-modules, ensure]
            stdout: '^catalogue ok \d+\r?\n?$'
      jobs: {service: nivo-api, command: [node, be/dist/apps/cli/src/main.js, jobs]}
      tasks:
        seed-modules: {service: nivo-api, command: [node, be/dist/apps/cli/src/main.js, seed-modules, run]}
        ensure-workspace: {service: nivo-api, command: [node, be/dist/apps/cli/src/main.js, seed-workspace, ensure]}
        verify-workspace: {service: nivo-api, command: [node, be/dist/apps/cli/src/main.js, seed-workspace, verify]}
      backup:
        image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
        keepDays: 14
        dir: /srv/nivo/backups
        volumes:
          - {name: n8n-data, volume: nivo-engine_n8n-data}
          - {name: redis-data, volume: nivo-engine_redis-data}
          - {name: ai-router-data, volume: nivo-engine_ai-router-data}
      # The swarm Traefik is the SHARED ingress of the VPS (INGRESS-INVENTORY.md): nivo plus the compose tenants, which are
      # reached over the attachable overlay. Tenant route files (academy.yml, tayson.yml) stay in the legacy dynamic directory.
      ingress:
        name: ingress
        service: ingress
        # the same pinned Traefik binary the live edge runs; its static arguments are read from the live edge container by `ingress create`
        image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
        network: nivo-edge-swarm
        acmeVolume: nivo-edge_acme
        legacy:
          dir: /home/nivo/nivo-edge
          dynamicDir: /home/nivo/nivo-edge/dynamic
          container: nivo-edge-traefik-1
        routes: infra/swarm/edge/routes.yml
        # `ingress publish`: nivo's routes go into the shared directory as nivo.yml; the generic routes.yml of the old edge (nivo, namnivo, n8n and engine routes) is backed up (age) and retired. Tenant files (academy.yml, tayson.yml) are never touched.
        publish: {file: nivo.yml, supersedes: [routes.yml]}
        upstreams:
          - {name: nivo-web, hosts: [nivo.vn, www.nivo.vn], container: nivo-web-web-1, aliases: [nivo-web], port: 3000}
          - {name: namnivo, hosts: [nguyentuannam.org, www.nguyentuannam.org, app.nguyentuannam.org], container: namnivo-web-web-1, aliases: [namnivo-web], port: 3000}
          - {name: tayson-web, hosts: [doanhnghieptayson.vn, www.doanhnghieptayson.vn], container: tayson-web, aliases: [tayson-web], port: 3073}
          - {name: tayson-api, container: tayson-api, aliases: [tayson-api], port: 3074}
          - {name: tayson-crm, hosts: [crm.doanhnghieptayson.vn], container: tayson-crm, aliases: [tayson-crm], port: 3173}
          - {name: academy-core, hosts: [api.academy.starci.org], container: academy-core, aliases: [academy-core], port: 20860}
          - {name: academy-judge0, hosts: [judge0.academy.starci.org], container: academy-judge0-server, aliases: [academy-judge0-server], port: 2358}
          - {name: academy-keycloak, hosts: [keycloak.starci.org], container: academy-keycloak, aliases: [academy-keycloak], port: 8080}
          - {name: academy-minio, hosts: [minio.starci.org, console.minio.starci.org], container: academy-minio, aliases: [academy-minio], port: 9000}
        # engine.nivo.vn (old engine health) and app-vps.nivo.vn (a temporary hostname while nivo.vn was on Netlify, no public DNS any more) are dropped
        drop: [engine.nivo.vn, app-vps.nivo.vn]
        backup: {dir: /srv/nivo/backups}
        verify:
          - {host: nivo.vn, path: /, status: 200}
          - {host: www.nivo.vn, path: /, status: 200}
          - {host: app.nivo.vn, path: /health/live, status: 200}
          - {host: n8n.nivo.vn, path: /, status: 200}
          - {host: nguyentuannam.org, path: /, status: 200}
          - {host: www.nguyentuannam.org, path: /, status: 200}
          - {host: app.nguyentuannam.org, path: /, status: 307}
          - {host: doanhnghieptayson.vn, path: /, status: 200}
          - {host: www.doanhnghieptayson.vn, path: /, status: 301}
          - {host: crm.doanhnghieptayson.vn, path: /, status: 200}
          - {host: api.academy.starci.org, path: /, status: 404}
          - {host: judge0.academy.starci.org, path: /, status: 200}
          - {host: keycloak.starci.org, path: /, status: 302}
# Release gates for `starci app release gate`. The landing reads its public origins at build time (next.config redirects), so
# build-fe gets the production public URLs; they are the same values as the image build arguments, none of them is a secret.
release:
  gates:
    - {name: app-check, command: [npx, starci, app, check]}
    - {name: typecheck, command: [npm, run, typecheck]}
    - {name: build-be, command: [npm, run, build:be]}
    - {name: lint, command: [npm, run, lint]}
    - name: build-fe
      command: [npm, run, build:fe]
      env: {NEXT_PUBLIC_SITE_URL: "https://nivo.vn", NEXT_PUBLIC_APP_URL: "https://app.nivo.vn"}
    - {name: test, command: [npm, run, test], summary: jest}
# Database history for `starci app db migrate` / `post-cutover` (the 24 restamped versions come from be/docs/runbooks/migration-restamp.md).
database:
  target: stack
  service: db
  migrationsDir: db/migrations
  archiveDir: db/migrations/archive
  baseline: baseline
  appPassword: {member: postgres, key: APP_BE_DB_PASSWORD}
  # v0.2.1 cutover (owner decision 2026-10-17): production was reset and the whole chain 000000..000600 applied on an empty schema, so nothing is held
  # back. The pre-reset database lives only in the encrypted dump named in infra/swarm/recovery/db-backup-receipt-v0.2.1.md.
  restamp:
    - {from: "20261013100000", to: "20261012100100"}
    - {from: "20261014100000", to: "20261012100200"}
    - {from: "20261015100000", to: "20261012100300"}
    - {from: "20261016100000", to: "20261012100400"}
    - {from: "20261017100000", to: "20261012100500"}
    - {from: "20261018100000", to: "20261012100600"}
    - {from: "20261019100000", to: "20261012100700"}
    - {from: "20261020100000", to: "20261012100800"}
    - {from: "20261021100000", to: "20261012100900"}
    - {from: "20261021110000", to: "20261012101000"}
    - {from: "20261021120000", to: "20261012101100"}
    - {from: "20261021130000", to: "20261012101200"}
    - {from: "20261022100000", to: "20261012101300"}
    - {from: "20261022110000", to: "20261012101400"}
    - {from: "20261022120000", to: "20261012101500"}
    - {from: "20261022130000", to: "20261012101600"}
    - {from: "20261022140000", to: "20261012101700"}
    - {from: "20261022150000", to: "20261012101800"}
    - {from: "20261023100000", to: "20261012101900"}
    - {from: "20261023110000", to: "20261012102000"}
