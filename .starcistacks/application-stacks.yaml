  production:
    status: supported
    runtime: docker-swarm
    composeFiles:
      - infra/swarm/stack.yaml
    components:
      nivo-api:
        replicas: 1
        port: 8787
        # internal AI gateway of the api process: port = api port + offset 1 (local dev 3211 -> 3212; ai-router 8788 in production); AI_ROUTER_PORT below derives from it
      nivo-mcp:
        replicas: 1
        port: 8790
      nivo-web-app:
        replicas: 1
        port: 3000
      nivo-landing:
        replicas: 1
        port: 3000
      nivo-admin:
        replicas: 1
        port: 3000
      nivo-n8n:
        replicas: 1
        port: 5678
      nivo-redis:
        replicas: 1
        port: 6379
      nivo-qdrant:
        replicas: 1
        port: 6333
      db:
        replicas: 1
        port: 5432
      nivo-postgres-backup:
        replicas: 1
    runbook: README.md
    # The ingress is the shared Traefik of the VPS, its own docker stack (deploy.ingress.name); this stack renders no ingress and publishes no port.
    ingress:
      external: {stack: ingress}
      hosts: [nivo.vn, www.nivo.vn, app.nivo.vn, admin.nivo.vn, api.nivo.vn, n8n.nivo.vn]
    dns:
      - host: nivo.vn
        owner: Production operator
        receipt: "README.md (owner action 1: A record at Tino; receipt nslookup nivo.vn 1.1.1.1)"
      - host: www.nivo.vn
        owner: Production operator
        receipt: "README.md (owner action 1: A record at Tino; receipt nslookup www.nivo.vn 1.1.1.1)"
      - host: app.nivo.vn
        owner: Production operator
        receipt: "README.md (owner action 1: A record at Tino; receipt nslookup app.nivo.vn 1.1.1.1)"
      - host: admin.nivo.vn
        owner: Production operator
        receipt: "README.md (owner action 1: A record at Tino; receipt nslookup admin.nivo.vn 1.1.1.1)"
      - host: api.nivo.vn
        owner: Production operator
        receipt: "README.md (owner action 1: A record at Tino; receipt nslookup api.nivo.vn 1.1.1.1)"
      - host: n8n.nivo.vn
        owner: Production operator
        receipt: "README.md (owner action 1: A record at Tino; receipt nslookup n8n.nivo.vn 1.1.1.1)"
    tls:
      owner: Production operator
      receipt: "README.md (the shared Traefik obtains one Let's Encrypt certificate per host and persists it in the external volume nivo-edge_acme)"
    release:
      imagesLock: .starcistacks/production/infra/swarm/release/images.lock.yaml
      pointer: .starcistacks/production/infra/swarm/release/current.yaml
      previous: .starcistacks/production/infra/swarm/release/previous.yaml
      healthAssertions:
        - https://api.nivo.vn/healthz answers 200 with status ok, /readyz answers 200 and a GraphQL {__typename} answers 200.
        - https://nivo.vn/health/live and https://www.nivo.vn/health/live (landing) https://app.nivo.vn/health/live (console) and https://admin.nivo.vn/health/live (platform admin) answer 200.
        - https://nivo.vn/healthz reaches the api (legacy webhook path).
        - The jobs watchdog of the running api task prints two non-negative integers.
        - The nivo-mcp task is healthy (container healthcheck on /healthz); it is internal only, so no public URL is probed.
        - Desired and running replicas agree, no task failed, and every update completed (starci app stack converge).
    # Stateful components. The volumes are the external nivo-engine_* ones; encrypted tarballs are written by
    # `starci app stack backup` (deploy.backup below) and copied off the VPS by the operator. Restore proofs: infra/swarm/recovery/restore-proof.md.
    backup:
      - component: db
        target: Daily age-encrypted pg_dump (custom format) of db written by nivo-postgres-backup to the volume nivo-engine_postgres-backups (nivo-db-<UTC stamp>.dump.age plus a .sha256), encrypted to the project recipient of .sops.yaml. The operator copies the files off the VPS. The cloud data is not carried over (owner ruling 2026-10-29), production starts clean from db/bootstrap.sql and db/migrations; restore of a nightly file and the clean start are in infra/swarm/recovery/db-runbook.md.
        retention: 14 days on the VPS (BACKUP_KEEP_DAYS in the stack); off-host retention is the operator's.
        owner: Production operator
        restoreProof: .starcistacks/production/infra/swarm/recovery/db-runbook.md
      - component: nivo-postgres-backup
        target: The age-encrypted pg_dump files it writes live on the volume nivo-engine_postgres-backups (the same copy set as the db record); the container itself holds no state.
        retention: 14 days on the VPS (BACKUP_KEEP_DAYS in the stack); off-host retention is the operator's.
        owner: Production operator
        restoreProof: .starcistacks/production/infra/swarm/recovery/db-runbook.md
      - component: nivo-api
        target: The video-cache volume holds only re-renderable voiceover clips (no backup needed).
        retention: Not applicable for the cache.
        owner: Production operator
        restoreProof: .starcistacks/production/infra/swarm/recovery/restore-proof.md
      - component: nivo-n8n
        target: age-encrypted tarball of nivo-engine_n8n-data (the SQLite database and workflows; starci app stack backup) in /srv/nivo/backups, copied off the VPS by the operator.
        retention: 14 days on the VPS (deploy.backup.keepDays); off-host retention is the operator's.
        owner: Production operator
        restoreProof: .starcistacks/production/infra/swarm/recovery/restore-proof.md
      - component: nivo-redis
        target: age-encrypted tarball of nivo-engine_redis-data (the AOF of the BullMQ broker; starci app stack backup) in /srv/nivo/backups. The PostgreSQL job_outbox is the durable record and republishes anything the broker loses, so this backup is convenience, not correctness.
        retention: 14 days on the VPS (deploy.backup.keepDays); off-host retention is the operator's.
        owner: Production operator
        restoreProof: .starcistacks/production/infra/swarm/recovery/restore-proof.md
