    # `starci app stack up --env dev --execute` reads this block (PROJECT-STACKS-6). One command brings up the db (own role per environment),
    # Redis and MinIO in containers, migrates, and runs the api, the mcp gateway, the console and the landing natively.
    local:
      ports:
        db: 54332
        redis: 56379
        qdrant: 56333
        minio: 59000
        api: 18787
        gateway: 18788
        mcp: 18790
        web: 3100
        landing: 3103
        admin: 3105
      services:
        - {name: db, wait: healthy}
        - {name: nivo-redis, wait: healthy}
        - {name: nivo-qdrant, wait: healthy}
        - {name: nivo-minio, wait: tcp, port: minio}
      dirs: [ai-router, mail-outbox]
      database:
        service: db
        port: db
        urlEnv: PRIMARY_DB_URL
        appRole: app_be
        password: {member: db, key: DB_OWNER_PASSWORD}
        adminPassword: {member: db, key: POSTGRES_PASSWORD}
        appPassword: {member: db, key: DB_APP_PASSWORD}
      grants:
        - {name: db, keys: [POSTGRES_PASSWORD]}
        - {name: minio, keys: [STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY]}
        - {name: qdrant, keys: [QDRANT_API_KEY]}
      custody:
        - {member: db, key: POSTGRES_PASSWORD, kind: password}
        - {member: db, key: DB_OWNER_PASSWORD, kind: password}
        - {member: db, key: DB_APP_PASSWORD, kind: password}
        - {member: storage, key: STORAGE_ACCESS_KEY, kind: hex, bytes: 12}
        - {member: storage, key: STORAGE_SECRET_KEY, kind: hex, bytes: 24}
        - {member: platform, key: CHANNEL_TOKEN_KEY, kind: base64, bytes: 32}
        - {member: platform, key: ENTITY_ENGINE_CURSOR_KEY, kind: base64, bytes: 32}
        - {member: platform, key: OTP_PEPPER, kind: hex, bytes: 32}
        - {member: platform, key: N8N_SIGNING_SECRET, kind: hex, bytes: 32}
      setup:
        - {name: install, argv: [npm, ci], heavy: install, skipIfExists: node_modules}
        - {name: codegen, argv: [npm, run, codegen, --silent], heavy: build}
        # The api and the mcp gateway run compiled: Nest reads GraphQL field types from the decorator metadata only tsc emits,
        # so a transpile-only loader leaves a union-typed field (RunFlowInput.kind) as Object and boot fails.
        - {name: build-be, argv: [npm, run, build:be], heavy: build}
        # The console runs compiled (next build, then next start): under next dev a page compiles on its first request, and a browser walk
        # met an unhydrated sign-in form for seconds. The public build values are the dev origins.
        - name: build-web
          argv: [npx, next, build]
          cwd: fe/apps/web
          heavy: build
          env:
            NEXT_PUBLIC_API_URL: "https://nivo-local.starci.org"
            NEXT_PUBLIC_LOCAL_API_URL: "http://localhost:${port.api}"
            NEXT_PUBLIC_DEVELOPER_API_URL: "https://nivo-local.starci.org"
            NEXT_PUBLIC_SITE_URL: "https://nivo-local-app.starci.org"
            NEXT_PUBLIC_LANDING_URL: "http://localhost:${port.landing}"
            NEXT_PUBLIC_ADMIN_URL: "https://nivo-local-admin.starci.org"
            NEXT_PUBLIC_LOCAL_ADMIN_URL: "http://localhost:${port.admin}"
      seed:
        # The module catalogue, as the production deploy runs it (verify exec "catalogue synced"): without it public.modules lacks the rows
        # the installations name. It upserts, so a rerun is safe.
        - name: catalogue
          argv: [node, dist/apps/cli/src/main.js, seed-modules, ensure]
          cwd: be
          after: migrate
          files: [AUTH_JWT_PRIVATE_KEY, AUTH_JWT_PUBLIC_KEY, CHANNEL_TOKEN_KEY, ENTITY_ENGINE_CURSOR_KEY, OTP_PEPPER, N8N_SIGNING_SECRET, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY, STARCI_AI_KEY, MAIL_HOST, MAIL_USER, MAIL_PASSWORD, MAIL_FROM]
          env:
            PRIMARY_DB_SCHEMA: public
            SITE_URL: "https://nivo-local-app.starci.org"
            PUBLIC_SITE_URL: "https://nivo-local-app.starci.org"
            AUTH_WEB_ORIGIN: "https://nivo-local-app.starci.org"
            PUBLIC_API_URL: "https://nivo-local.starci.org"
            STORAGE_ENDPOINT: "http://127.0.0.1:${port.minio}"
            STORAGE_BUCKET_PREFIX: nivo-dev
            MAIL_PORT: "587"
            MAIL_SECURITY: starttls
            MAIL_FROM_NAME: NIVO
            MAIL_DEFAULT_LANGUAGE: vi
            MAIL_SUPPRESS: "*.example.test,*.example.com,*.invalid"
        # The buckets of the environment (cli storage bootstrap: creates the missing ones, opens the picture bucket to anonymous reads):
        # without them every upload and media read answers OBJECT_STORAGE_UNAVAILABLE. Safe to run again.
        - name: buckets
          argv: [node, dist/apps/cli/src/main.js, storage, bootstrap]
          cwd: be
          after: migrate
          files: [AUTH_JWT_PRIVATE_KEY, AUTH_JWT_PUBLIC_KEY, CHANNEL_TOKEN_KEY, ENTITY_ENGINE_CURSOR_KEY, OTP_PEPPER, N8N_SIGNING_SECRET, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY, STARCI_AI_KEY, MAIL_HOST, MAIL_USER, MAIL_PASSWORD, MAIL_FROM]
          env:
            PRIMARY_DB_SCHEMA: public
            SITE_URL: "https://nivo-local-app.starci.org"
            PUBLIC_SITE_URL: "https://nivo-local-app.starci.org"
            AUTH_WEB_ORIGIN: "https://nivo-local-app.starci.org"
            PUBLIC_API_URL: "https://nivo-local.starci.org"
            STORAGE_ENDPOINT: "http://127.0.0.1:${port.minio}"
            STORAGE_BUCKET_PREFIX: nivo-dev
            MAIL_PORT: "587"
            MAIL_SECURITY: starttls
            MAIL_FROM_NAME: NIVO
            MAIL_DEFAULT_LANGUAGE: vi
            MAIL_SUPPRESS: "*.example.test,*.example.com,*.invalid"
      processes:
        - name: api
          argv: [node, dist/apps/api/src/main.js]
          cwd: be
          port: api
          files: [AUTH_JWT_PRIVATE_KEY, AUTH_JWT_PUBLIC_KEY, CHANNEL_TOKEN_KEY, ENTITY_ENGINE_CURSOR_KEY, OTP_PEPPER, N8N_SIGNING_SECRET, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, NIVO_PLATFORM_ADMINS, STARCI_AI_KEY, MAIL_HOST, MAIL_USER, MAIL_PASSWORD, MAIL_FROM, TELEGRAM_API_ID, TELEGRAM_API_HASH, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, QDRANT_API_KEY]
          env:
            PORT: "${port.api}"
            PRIMARY_DB_SCHEMA: public
            SITE_URL: "https://nivo-local-app.starci.org"
            PUBLIC_SITE_URL: "https://nivo-local-app.starci.org"
            AUTH_WEB_ORIGIN: "https://nivo-local-app.starci.org"
            AUTH_GOOGLE_CALLBACK_URL: "http://localhost:${port.api}/auth/google/callback"
            # The refresh cookie takes Domain=starci.org on the dev tunnel host and stays host-only on localhost (@starci/auth 0.4.0 domains).
            AUTH_COOKIE_DOMAINS: "starci.org"
            PUBLIC_API_URL: "https://nivo-local.starci.org"
            HTTP_SECURITY_ALLOWED_ORIGINS: "http://localhost:${port.web},http://localhost:${port.landing},http://localhost:${port.admin},http://localhost:3900,https://nivo-local-app.starci.org,https://nivo-local-admin.starci.org"
            # Dev only: UI agents screenshot in parallel and each signs in once; the default strict limit (30/min) refused them with 429.
            HTTP_SECURITY_RATE_STRICT_LIMIT: "300"
            # SITE_URL is the public tunnel origin, so the private-target guards of a workspace SMTP account and a data source no longer see a development site.
            DATA_ALLOW_PRIVATE_HOSTS: "true"
            # How many agent runs execute at once (the drains this api runs; a run parked at a wait or a stop holds none), default 100.
            # AGENT_RUNS_WORKSPACE_CONCURRENCY (unset = the same 100) is how many of them ONE workspace may hold: a self-hosted install
            # has one workspace and reaches all of them; only a shared multi-tenant deployment sets it lower (agent-runs-limit.service.ts).
            AGENT_RUNS_CONCURRENCY: "100"
            AGENT_RUNS_WORKSPACE_CONCURRENCY: "100"
            # The running build's name (the jobs and the entity engine read it).
            APP_BUILD_ID: dev
            SMTP_ALLOW_PRIVATE_HOSTS: "true"
            # Dev only: provider sandbox accounts (no credentials, hardcoded cases; rulings R56-R62). Absent in production = off.
            PROVIDER_SANDBOX_ENABLED: "true"
            # Embeddings: the pinned OpenAI profile (text-embedding-3-small@1536). The AI pool is ANTHROPIC_API_KEY (chat) + OPENAI_API_KEY
            # (embeddings); OPENROUTER_API_KEY stays sealed and listed in files: but the pool no longer reads it (owner 2026-11-11).
            AI_EMBEDDING_MODEL: embed-oa
            STORAGE_ENDPOINT: "http://127.0.0.1:${port.minio}"
            STORAGE_BUCKET_PREFIX: nivo-dev
            MAIL_PORT: "587"
            MAIL_SECURITY: starttls
            MAIL_FROM_NAME: NIVO
            MAIL_DEFAULT_LANGUAGE: vi
            MAIL_SUPPRESS: "*.example.test,*.example.com,*.invalid"
            MAIL_OUTBOX_DIR: "${data}/mail-outbox"
            QUEUE_ENABLED: "true"
            QUEUE_REDIS_HOST: 127.0.0.1
            QUEUE_REDIS_PORT: "${port.redis}"
            QUEUE_REDIS_PREFIX: nivo
            # Jobs of one workspace that may run at once ON EACH QUEUE (default 2; per queue from migration 20261114000400, before it
            # across all queues): dev runs 6 (coordinator, build EIGHT). The agent-turn drains add AGENT_RUNS_WORKSPACE_CONCURRENCY to it.
            QUEUE_WORKSPACE_CONCURRENCY: "6"
            REALTIME_HUB: redis
            REALTIME_REDIS_URL: "redis://127.0.0.1:${port.redis}"
            REALTIME_REDIS_PREFIX: nivo-realtime
            AI_BASE_URL: "http://127.0.0.1:${port.gateway}/v1"
            AI_ROUTER_KEYS_PATH: "${data}/ai-router/keys.db"
            # The vector index (Qdrant): REQUIRED (the only home of vectors; the api refuses to start without it, readiness says `vectors`).
            QDRANT_URL: "http://127.0.0.1:${port.qdrant}"
            WORKSPACE_SIGNUP_ENABLED: "true"
          health: {url: "http://localhost:${port.api}/healthz"}
        - name: mcp
          argv: [node, dist/apps/mcp/src/main.js]
          cwd: be
          port: mcp
          files: [CHANNEL_TOKEN_KEY, ENTITY_ENGINE_CURSOR_KEY, STARCI_AI_KEY, QDRANT_API_KEY, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY]
          env:
            PORT: "${port.mcp}"
            # TEN (RESTART-R, rehearsal 2026-11-13): the mcp env reader requires the object store and the site origin; drop with H1 if the narrowed mcp no longer reads them.
            SITE_URL: "https://nivo-local-app.starci.org"
            STORAGE_ENDPOINT: "http://127.0.0.1:${port.minio}"
            STORAGE_BUCKET_PREFIX: nivo-dev
            PRIMARY_DB_SCHEMA: public
            HTTP_SECURITY_ALLOWED_ORIGINS: "http://localhost:${port.web},https://nivo-local-app.starci.org"
            QUEUE_ENABLED: "true"
            QUEUE_REDIS_HOST: 127.0.0.1
            QUEUE_REDIS_PORT: "${port.redis}"
            QUEUE_REDIS_PREFIX: nivo
            QUEUE_WORKSPACE_CONCURRENCY: "6"
            AI_BASE_URL: "http://127.0.0.1:${port.gateway}/v1"
            # The same vector index as the api: a truth this process puts in force hands its vector over, and the tools search it.
            QDRANT_URL: "http://127.0.0.1:${port.qdrant}"
          health: {url: "http://localhost:${port.mcp}/healthz"}
        - name: web
          # The build of the setup step build-web, served by next start in the app folder (turbo strips undeclared env such as PORT from
          # its tasks, and turbo.json is a managed file).
          argv: [npx, next, start]
          cwd: fe/apps/web
          port: web
          env:
            PORT: "${port.web}"
          health: {url: "http://localhost:${port.web}/health/live"}
        - name: landing
          # next dev directly in the app folder (the setup ran codegen): turbo strips undeclared env such as PORT from its tasks, and
          # turbo.json is a managed file, so `npm run dev:fe:landing` would start on 3000 whatever port is declared.
          argv: [npx, next, dev]
          cwd: fe/apps/landing
          port: landing
          env:
            PORT: "${port.landing}"
            NEXT_PUBLIC_SITE_URL: "http://localhost:${port.landing}"
            NEXT_PUBLIC_APP_URL: "http://localhost:${port.web}"
          health: {url: "http://localhost:${port.landing}/health/live"}
        - name: admin
          # The platform-admin app, started like the landing: next dev directly in the app folder (turbo would strip PORT). It reads the console's
          # session cookie (AUTH_COOKIE_DOMAINS) and calls the api from the browser, so it is a CORS origin of the api (HTTP_SECURITY_ALLOWED_ORIGINS).
          argv: [npx, next, dev]
          cwd: fe/apps/admin
          port: admin
          env:
            PORT: "${port.admin}"
            NEXT_PUBLIC_SITE_URL: "https://nivo-local-admin.starci.org"
            NEXT_PUBLIC_API_URL: "https://nivo-local.starci.org"
            NEXT_PUBLIC_LOCAL_API_URL: "http://localhost:${port.api}"
            NEXT_PUBLIC_APP_URL: "http://localhost:${port.web}"
          health: {url: "http://localhost:${port.admin}/health/live"}
      ready:
        - {name: api-live, url: "http://localhost:${port.api}/healthz"}
        - {name: api-ready, url: "http://localhost:${port.api}/readyz"}
        - {name: web-live, url: "http://localhost:${port.web}/health/live"}
        - {name: landing-live, url: "http://localhost:${port.landing}/health/live"}
        - {name: admin-live, url: "http://localhost:${port.admin}/health/live"}
      verify:
