# NIVO (nivo-lite) application stack, schema starci/application-stacks@1.
#
# dev        docker-swarm: the local Supabase (supabase CLI) with the be and the fe in containers.
# production docker-swarm on ONE Ubuntu VPS (single-manager swarm: orchestration without manager failover). The Supabase Cloud project is the
#            external datastore. Runbook: .starcistacks/production/README.md (the seven commands, the release flow, the cutover window).
#
# Facts the schema has no field for, stated here and in the production runbook so a reader of the manifest finds them:
#   Secret custody   sealed members .starcistacks/production/secrets/<slug>.enc (sops, age recipient in .sops.yaml). The deploy decrypts them in
#                    memory on the runner with SOPS_AGE_KEY (GitHub environment `production`) and pipes each value into
#                    `docker secret create nivo-<key>-v<keyed hash>` on the manager; the rendered stack keeps {external: true, name: <runtimeName>}.
#                    The logical name -> runtime name map is each release's release.json (/srv/nivo/releases/<digest>/).
#   Owner actions    (1) DNS at Tino: A records for nivo.vn, www.nivo.vn and api.nivo.vn -> the VPS (nothing scripts DNS; receipt: nslookup).
#                    (2) Approve `docker swarm init` on the VPS once (deploy/swarm/vps.sh prepare --init-swarm, NIVO_SWARM_INIT_APPROVED=1).
#                    (3) Keep the age identity backed up; set the GitHub environment secret SOPS_AGE_KEY and the reviewers of `production`.
#   Platform         Ubuntu Server 24.04 LTS amd64 (22.04 LTS amd64 is a candidate); Docker Engine from Docker's signed apt repository.
#   Runbook          .starcistacks/production/README.md; cutover: be/docs/runbooks/cutover.md; VPS: be/docs/runbooks/vps-stack.md.
schema: starci/application-stacks@1
sources:
  - repository: nivo-lite
components:
  api:
    role: service
    image: ghcr.io/starci183/nivo-lite-api
    compose: infra/swarm/stack.yaml
    purpose: The Nest api (GraphQL, provider webhooks, OAuth callbacks, the pgmq workers and schedulers, the job alert monitor). Liveness /healthz, readiness /readyz.
    required: true
  web:
    role: service
    image: ghcr.io/starci183/nivo-lite-web
    compose: infra/swarm/stack.yaml
    purpose: The Next.js app (standalone output); no runtime secret, its public values are build arguments. Liveness /health/live.
    required: true
  ingress:
    role: ingress
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    compose: infra/swarm/stack.yaml
    purpose: Traefik, the only service that publishes ports (8787/3000 locally; 80/443 in production). Production retains its persisted certificates and routes in infra/swarm/edge/routes.yml.
    required: true
  openclaw:
    role: stateful
    image: ghcr.io/openclaw/openclaw:2026.7.1@sha256:6a31d44b2944e7adcd2b582bf6fb463111264ebca97a0201795b799135bd102c
    compose: infra/swarm/stack.yaml
    purpose: The OpenClaw agent gateway. Private network only; the api reaches it by service DNS through the loopback relay of the entrypoint wrapper.
    required: true
  n8n:
    role: stateful
    image: docker.n8n.io/n8nio/n8n:1.64.3@sha256:4d9116228d426ce24c442a744e9c11ee7c1187713f93f21dd5a34a12584708c1
    compose: infra/swarm/stack.yaml
    purpose: n8n automation editor and webhook runner; private (operator tunnel only), reached by the api as n8n:5678. Its database is SQLite (DB_TYPE=sqlite) on the persisted named volume nivo-engine_n8n-data; no self-hosted Postgres (owner ruling 2026-10-14).
    required: true
backing:
  supabase:
    provider: supabase
    managed: true
environments:
  dev:
    status: supported
    runtime: docker-swarm
    composeFiles:
      - infra/swarm/stack.yaml
    components:
      api:
        replicas: 1
        port: 8787
      web:
        replicas: 1
        port: 3000
      ingress:
        replicas: 1
        port: 3000
        httpPort: 8787
    runbook: README.md
    # Local development holds no sealed secret: the Supabase CLI owns the local backing stack and the operator supplies its
    # development configuration through the untracked .starcistacks/dev/api.dev.env. It is not a deployed Swarm component.
    secrets: []
  production:
    status: supported
    runtime: docker-swarm
    composeFiles:
      - infra/swarm/stack.yaml
    components:
      api:
        replicas: 1
        port: 8787
      web:
        replicas: 1
        port: 3000
      openclaw:
        replicas: 1
        port: 18790
      n8n:
        replicas: 1
        port: 5678
    runbook: README.md
    secrets:
      - name: api
        where: secrets/api
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml (creation rule for .starcistacks/*/secrets/*.enc); the same recipient seals every member. Each key becomes one Swarm secret named nivo-<key>-v<keyed hash of the value>; rotation seals a new value, which creates a new name, updates the grant, waits for convergence, then removes the old name.
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine (backed up by the owner; docs/host-secrets.md) and the GitHub environment secret SOPS_AGE_KEY of `production`. The VPS never holds it.
      - name: auth
        where: secrets/auth
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; granted to the api like the api member.
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine and the GitHub environment secret SOPS_AGE_KEY of `production`.
      - name: stack
        where: secrets/stack
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; granted to openclaw and n8n (secrets) and read as configuration (OPENCLAW_MODEL, N8N_ALLOWED_HOSTS, job alert limits).
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine and the GitHub environment secret SOPS_AGE_KEY of `production`.
      - name: web
        where: secrets/web
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; holds the two public NEXT_PUBLIC_SUPABASE_* build values only (no runtime grant).
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine and the GitHub environment secret SOPS_AGE_KEY of `production`.
      - name: app-be-db
        where: secrets/app-be-db
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; used once by the cutover owner scripts to set the app_be role password and build PRIMARY_DB_URL.
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine; never sent to GitHub or the VPS.
      - name: ops
        where: secrets/ops
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; operator and cutover script settings, never granted to a service.
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine.
      - name: test-accounts
        where: secrets/test-accounts
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; smoke-test accounts, never granted to a service.
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine.
      - name: ci-ssh-key
        where: secrets/ci-ssh-key
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; JSON envelope of the CI deploy key material, set as the GitHub environment secret VPS_SSH_KEY.
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine.
      - name: vps-ssh-key
        where: secrets/vps-ssh-key
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; JSON envelope of the operator SSH key for the VPS.
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine.
      - name: vps-known-hosts
        where: secrets/vps-known-hosts
        recipientPolicy: SOPS/age to the project recipient in .sops.yaml; the pinned SSH host keys of the VPS (set as the GitHub environment secret VPS_KNOWN_HOSTS); first contact was owner-verified.
        keyCustody: The age identity is SOPS_AGE_KEY in the runtime .claude/secret.env on the owner machine.
    # Shared VPS ingress and the verbs of the canon (starci app stack ...): the data below is the only app-specific deploy configuration.
    deploy:
      stack: nivo
      remote:
        host: vps
        releasesBase: /srv/nivo
        sealed: {ops: ops, sshKey: vps-ssh-key, knownHosts: vps-known-hosts}
      images:
        api: {app: api}
        web:
          app: web
          buildArgs:
            values: {NEXT_PUBLIC_SITE_URL: "https://nivo.vn", NEXT_PUBLIC_API_URL: "https://api.nivo.vn", NEXT_PUBLIC_DEVELOPER_API_URL: "https://api.nivo.vn"}
            sealed: {member: web, keys: [NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY]}
      volumes: [nivo-engine_openclaw-data, nivo-engine_video-cache, nivo-engine_n8n-data, nivo-edge_acme]
      secrets:
        grants:
          - service: api
            filePointers: true
            from:
              - {member: api}
              - {member: auth}
              - {member: stack, keys: [OPENCLAW_GATEWAY_TOKEN, OPENCLAW_MANAGE_AGENTS], fill: true}
          - service: openclaw
            from:
              - {member: stack, keys: [OPENCLAW_GATEWAY_TOKEN], required: true}
              - {member: stack, keys: [OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY]}
              - {member: api, keys: [OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY]}
          - service: n8n
            from:
              - {member: stack, keys: [N8N_ENCRYPTION_KEY], required: true}
        settings: {member: stack, keys: [OPENCLAW_MODEL, N8N_ALLOWED_HOSTS, JOBS_FAILED_ALERT, JOBS_STALE_SECONDS]}
      environment:
        api:
          files: [infra/swarm/api-public.conf]
          values:
            PORT: "8787"
            OPENCLAW_GATEWAY_URL: "ws://openclaw:18790"
            OPENCLAW_CONFIG_DIR: /openclaw-state
            OPENCLAW_GATEWAY_STATE_DIR: /home/node/.openclaw
          settings:
            N8N_ALLOWED_HOSTS: {key: N8N_ALLOWED_HOSTS, default: n8n}
            JOBS_ALERT_FAILED_MAX: {key: JOBS_FAILED_ALERT, default: "20"}
            JOBS_ALERT_STALE_SECONDS: {key: JOBS_STALE_SECONDS, default: "300"}
        openclaw:
          settings:
            OPENCLAW_MODEL: {key: OPENCLAW_MODEL, default: openrouter/deepseek/deepseek-v4-flash}
      configs:
        - {name: openclaw-entrypoint, file: infra/swarm/openclaw/entrypoint.sh, env: NIVO_CFG_OPENCLAW_ENTRYPOINT}
        - {name: openclaw-init, file: infra/swarm/openclaw/openclaw-init.mjs, env: NIVO_CFG_OPENCLAW_INIT}
        - {name: openclaw-relay, file: infra/swarm/openclaw/openclaw-relay.mjs, env: NIVO_CFG_OPENCLAW_RELAY}
      verify:
        http:
          - {name: api liveness, url: "https://api.nivo.vn/healthz", status: 200, json: {status: ok}, retry: true}
          - {name: api readiness, url: "https://api.nivo.vn/readyz", status: 200, retry: true}
          - {name: api graphql, url: "https://api.nivo.vn/graphql", method: POST, body: '{"query":"{__typename}"}', status: 200, contains: __typename, retry: true}
          - {name: web health on the apex, url: "https://nivo.vn/health/live", status: 200, retry: true}
          - {name: web health on www, url: "https://www.nivo.vn/health/live", status: 200, retry: true}
          - {name: legacy webhook path reaches the api, url: "https://nivo.vn/healthz", status: 200, retry: true}
        exec:
          - name: jobs watchdog prints two non-negative integers
            service: api
            command: [node, be/dist/apps/cli/src/main.js, jobs, watchdog]
            stdout: '^\d+ \d+\r?\n?$'
      jobs: {service: api, command: [node, be/dist/apps/cli/src/main.js, jobs]}
      tasks:
        seed-media:   {service: api, command: [node, be/dist/apps/cli/src/main.js, seed-media, upload, --dir, be/src/assets/media-seed]}
        seed-modules: {service: api, command: [node, be/dist/apps/cli/src/main.js, seed-modules, run]}
      backup:
        image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
        keepDays: 14
        dir: /srv/nivo/backups
        volumes:
          - {name: n8n-data, volume: nivo-engine_n8n-data}
          - {name: openclaw-data, volume: nivo-engine_openclaw-data}
      # The swarm Traefik is the SHARED ingress of VPS 103.142.27.9 (INGRESS-INVENTORY.md): nivo plus the compose tenants, which are
      # reached over the attachable overlay. Tenant route files (academy.yml, tayson.yml) stay in the legacy dynamic directory.
      ingress:
        name: ingress
        service: ingress
        # the same pinned Traefik binary the live edge runs; its static arguments are read from the live edge container by `ingress create`
        image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
        network: nivo-edge-swarm
        acmeVolume: nivo-edge_acme
        legacy:
          dir: /home/nivo/nivo-edge
          dynamicDir: /home/nivo/nivo-edge/dynamic
          container: nivo-edge-traefik-1
        routes: infra/swarm/edge/routes.yml
        # `ingress publish`: nivo's routes go into the shared directory as nivo.yml; the generic routes.yml of the old edge (nivo, namnivo, n8n and engine routes) is backed up (age) and retired. Tenant files (academy.yml, tayson.yml) are never touched.
        publish: {file: nivo.yml, supersedes: [routes.yml]}
        upstreams:
          - {name: nivo-web, hosts: [nivo.vn, www.nivo.vn], container: nivo-web-web-1, aliases: [nivo-web], port: 3000}
          - {name: namnivo, hosts: [nguyentuannam.org, www.nguyentuannam.org, app.nguyentuannam.org], container: namnivo-web-web-1, aliases: [namnivo-web], port: 3000}
          - {name: tayson-web, hosts: [doanhnghieptayson.vn, www.doanhnghieptayson.vn], container: tayson-web, aliases: [tayson-web], port: 3073}
          - {name: tayson-api, container: tayson-api, aliases: [tayson-api], port: 3074}
          - {name: tayson-crm, hosts: [crm.doanhnghieptayson.vn], container: tayson-crm, aliases: [tayson-crm], port: 3173}
          - {name: academy-core, hosts: [api.academy.starci.org], container: academy-core, aliases: [academy-core], port: 20860}
          - {name: academy-judge0, hosts: [judge0.academy.starci.org], container: academy-judge0-server, aliases: [academy-judge0-server], port: 2358}
          - {name: academy-keycloak, hosts: [keycloak.starci.org], container: academy-keycloak, aliases: [academy-keycloak], port: 8080}
          - {name: academy-minio, hosts: [minio.starci.org, console.minio.starci.org], container: academy-minio, aliases: [academy-minio], port: 9000}
        # engine.nivo.vn (old engine health) and app-vps.nivo.vn (a temporary hostname while nivo.vn was on Netlify, no public DNS any more) are dropped
        drop: [engine.nivo.vn, app-vps.nivo.vn]
        backup: {dir: /srv/nivo/backups}
        verify:
          - {host: nivo.vn, path: /, status: 200}
          - {host: www.nivo.vn, path: /, status: 200}
          - {host: n8n.nivo.vn, path: /, status: 200}
          - {host: nguyentuannam.org, path: /, status: 200}
          - {host: www.nguyentuannam.org, path: /, status: 200}
          - {host: app.nguyentuannam.org, path: /, status: 307}
          - {host: doanhnghieptayson.vn, path: /, status: 200}
          - {host: www.doanhnghieptayson.vn, path: /, status: 301}
          - {host: crm.doanhnghieptayson.vn, path: /, status: 200}
          - {host: api.academy.starci.org, path: /, status: 404}
          - {host: judge0.academy.starci.org, path: /, status: 200}
          - {host: keycloak.starci.org, path: /, status: 302}
# Database history for `starci app db migrate` / `post-cutover` (the 24 restamped versions come from be/docs/runbooks/migration-restamp.md).
database:
  migrationsDir: supabase/migrations
  archiveDir: supabase/migrations/_archive
  baseline: lite-baseline
  standard: lite-baseline-standard
  heldBack: [drop-engine-schema]
  projectRef: lytjlbytgqqykenajhgr
  restamp:
    - {from: "20261013100000", to: "20261012100100"}
    - {from: "20261014100000", to: "20261012100200"}
    - {from: "20261015100000", to: "20261012100300"}
    - {from: "20261016100000", to: "20261012100400"}
    - {from: "20261017100000", to: "20261012100500"}
    - {from: "20261018100000", to: "20261012100600"}
    - {from: "20261019100000", to: "20261012100700"}
    - {from: "20261020100000", to: "20261012100800"}
    - {from: "20261021100000", to: "20261012100900"}
