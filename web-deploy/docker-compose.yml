# The Next.js app on the NIVO VPS: its own compose project (~/nivo-web), separate from the engine stack so neither deploy recreates the other.
# No public port: the Traefik edge (~/nivo-edge, deploy/edge/) reaches it as nivo-web:3000 over the external docker network "nivo-edge".
# 127.0.0.1:3000 is published for on-box debugging only. The image is built on the GitHub runner and loaded with docker load.
name: nivo-web

services:
  web:
    image: nivo-web:${WEB_TAG:?set WEB_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 600m
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    networks:
      default:
      edge:
        aliases: [nivo-web]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  edge:
    name: nivo-edge
    external: true
