# Non-secret production configuration of the api (committed; compose `env_file` reads it before the generated api.env of secret pointers).
# A key listed here must NOT also be sealed. Secrets never go in this file: they live in .starcistacks/production/secrets/*.enc.
# The web app is served on nivo.vn / www.nivo.vn (the browser origins CORS allows) and the API on api.nivo.vn. Webhooks configured with the
# old https://nivo.vn/api/... URLs keep working through the edge.
PRIMARY_DB_SCHEMA=public
SITE_URL=https://nivo.vn
PUBLIC_SITE_URL=https://nivo.vn
PUBLIC_API_URL=https://api.nivo.vn
HTTP_SECURITY_ALLOWED_ORIGINS=https://nivo.vn,https://www.nivo.vn
N8N_WEBHOOK_BASE=http://n8n:5678/webhook/nivo-events
