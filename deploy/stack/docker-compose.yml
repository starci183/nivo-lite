# NIVO stack for ONE Ubuntu VPS: the api + openclaw + n8n (+ its own postgres), and an optional caddy (TLS).
# Read be/docs/runbooks/vps-stack.md first. Run from this folder:  API_TAG=<tag> docker compose --env-file .env up -d
#
# Network layout (this is deliberate):
#   caddy      publishes 80/443. Everything else is private to the compose network.
#   openclaw   OpenClaw gateway, raw WebSocket on 18789. Published ONLY on 127.0.0.1 (reach it with an SSH tunnel for its Control UI).
#   api        network_mode: service:openclaw  -> it shares openclaw network namespace, so it reaches the gateway on 127.0.0.1:18789.
#              That is not a convenience: the gateway honours the scopes a client declares ONLY for a loopback peer using a shared
#              secret (docs/OPENCLAW-GATEWAY-PROTOCOL.md in nivo-backend). From any other address the scopes are cleared and
#              sessions.send is refused. Consequences: the api listens inside openclaw namespace (caddy reaches it as openclaw:8787),
#              and recreating openclaw recreates the api too (compose does this for you).
#   n8n        behind caddy at n8n.<domain>; talks to its own postgres (n8n-db).
# Background jobs (be/docs/guides/jobs.md) run on Supabase Queues (pgmq) in the app's Supabase Postgres: no queue service in this stack.

# The project name stays nivo-engine on purpose: compose prefixes the volume names with it (openclaw-data, n8n-db, ...), and renaming it would orphan them.
name: nivo-engine

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    # Optional public door. Off by default (profile "public"): on a host where another ingress already owns 80/443
    # (the Traefik edge in deploy/edge) the stack runs without it; the api needs no inbound port at all.
    profiles: ["public"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      N8N_ALLOWED_CIDRS: ${N8N_ALLOWED_CIDRS:-0.0.0.0/0 ::/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - n8n
      - openclaw
    logging: *logging

  openclaw-init:
    # Writes the gateway settings the stack relies on into openclaw.json before the gateway starts (idempotent merge: other
    # keys, agents and plugins OpenClaw or an operator added are kept). Loopback bind + token auth: only the api, which
    # shares the gateway's network namespace, can reach it.
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw}:${OPENCLAW_TAG:-2026.7.1}
    restart: "no"
    entrypoint: ["node", "-e"]
    command:
      - |
        const fs = require("fs"), p = "/home/node/.openclaw/openclaw.json";
        let c = {}; try { c = JSON.parse(fs.readFileSync(p, "utf8")); } catch {}
        c.agents = c.agents || {}; c.agents.defaults = { ...(c.agents.defaults || {}), skipBootstrap: true }; // the api writes each agent workspace itself (openclaw.sync_agent): no first-run ritual
        c.session = { ...(c.session || {}), maintenance: { ...((c.session || {}).maintenance || {}), mode: "enforce", pruneAfter: "7d", maxEntries: 400, maxDiskBytes: "400mb" } };
        c.gateway = { ...(c.gateway || {}), mode: "local", bind: "loopback", port: 18789,
          auth: { ...((c.gateway || {}).auth || {}), mode: "token", token: process.env.OPENCLAW_GATEWAY_TOKEN } };
        const model = process.env.OPENCLAW_MODEL;
        if (model) { c.agents = c.agents || {}; c.agents.defaults = c.agents.defaults || {};
          c.agents.defaults.model = { ...(c.agents.defaults.model || {}), primary: model };
          // OpenRouter DeepSeek V4 models think by default (hundreds of reasoning tokens, seconds of latency, 2x cost): switch reasoning off in the request body.
          const models = c.agents.defaults.models = c.agents.defaults.models || {}; const prev = models[model] || {};
          models[model] = { ...prev, params: { ...(prev.params || {}), extra_body: { ...((prev.params || {}).extra_body || {}), reasoning: { enabled: false } } } }; }
        fs.mkdirSync("/home/node/.openclaw", { recursive: true });
        fs.writeFileSync(p, JSON.stringify(c, null, 2), { mode: 0o600 });
        console.log("openclaw.json ready (gateway local/loopback/token" + (model ? ", model " + model : "") + ")");
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openrouter/deepseek/deepseek-v4-flash}
    volumes:
      - openclaw-data:/home/node/.openclaw
    logging: *logging

  openclaw:
    # Same image family nivo-backend provisions (AGENTOS_IMAGE_OPENCLAW_REPOSITORY). Pin a tag you have tested; the protocol document
    # was measured against 2026.7.1. VERIFY the default start command of your tag (docker run --rm <image> --help) before first deploy.
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw}:${OPENCLAW_TAG:-2026.7.1}
    restart: unless-stopped
    environment:
      # Gateway credential: the api presents the same value (OPENCLAW_GATEWAY_TOKEN below).
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      # Model provider keys: set whichever provider your OpenClaw agents are configured for (empty ones are ignored).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    # The api lives in this network namespace, so its port is published here. Bind to the Docker bridge address
    # (API_BIND=172.29.0.1) to let the Traefik edge reach it; the edge routes api.nivo.vn and every /api/ path of the product hosts.
    ports:
      - "${API_BIND:-${ENGINE_BIND:-127.0.0.1}}:8787:8787"
    volumes:
      - openclaw-data:/home/node/.openclaw
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  api:
    # The Nest api (be/apps/api) replaced the engine at the lite cutover. The image is built on the GitHub runner (api-deploy.yml) and loaded
    # with docker load, so the VPS only runs it. It keeps the engine's place in the stack: same network namespace as OpenClaw, same port.
    image: nivo-api:${API_TAG:?set API_TAG (the deploy workflow does)}
    restart: unless-stopped
    network_mode: "service:openclaw"
    depends_on:
      openclaw:
        condition: service_healthy
    # api.env is the runtime environment of the api only (PRIMARY_DB_URL, SUPABASE_*, HTTP_SECURITY_*, the provider and queue keys): the
    # stack .env (n8n encryption key, database password, ...) never reaches this container. The values below are the stack facts.
    env_file: api.env
    environment:
      PORT: "8787"
      OPENCLAW_GATEWAY_URL: ws://127.0.0.1:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_CONFIG_DIR: /openclaw-state
      OPENCLAW_GATEWAY_STATE_DIR: /home/node/.openclaw
      N8N_ALLOWED_HOSTS: ${N8N_ALLOWED_HOSTS:-n8n}
    volumes:
      - openclaw-data:/openclaw-state
      - video-cache:/var/cache/nivo-video # voiceover clips by text hash: re-rendering the same script costs no TTS call
    stop_grace_period: 45s # running jobs finish or are handed back before the container stops
    logging: *logging

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  n8n:
    # Version nivo-backend pins (AGENTOS_IMAGE_N8N_TAG). Upgrade deliberately: n8n migrates its database on start.
    image: docker.n8n.io/n8nio/n8n:${N8N_TAG:-1.64.3}
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: "5678"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    # N8N_BIND=127.0.0.1 keeps it private (SSH tunnel); N8N_BIND=172.29.0.1 lets the Traefik edge serve it at https://n8n.nivo.vn.
    ports:
      - "${N8N_BIND:-127.0.0.1}:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    logging: *logging

volumes:
  video-cache:
  caddy-data:
  caddy-config:
  openclaw-data:
  n8n-data:
  n8n-db:
