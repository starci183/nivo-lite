# Routes of the NIVO edge (Traefik file provider; reloaded on change, no restart). Each host gets its own Let's Encrypt certificate.
# The product is served on nivo.vn and www.nivo.vn (web) and api.nivo.vn (the api). The zone is at Tino: every host needs its A record there
# (be/docs/runbooks/dns-rollback.md) before Traefik can obtain its certificate.
# Lite cutover: the Nest api replaced the engine and the Next route handlers. It answers api.nivo.vn, and keeps answering the /api/, /graphql and
# /healthz paths of nivo.vn and www.nivo.vn so every webhook URL customers configured with the old host keeps working.
# Optional hosts without DNS today (n8n., engine., app-vps.) have no router; the n8n one is kept commented below.
http:
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
  routers:
    web:
      rule: Host(`nivo.vn`) || Host(`www.nivo.vn`)
      entryPoints: [websecure]
      service: web
      middlewares: [secure-headers]
      tls: { certResolver: le }
    # Every /api/ path of the product hosts is the back end: provider webhooks and OAuth callbacks keep their public URLs
    # (/api/telegram/..., /api/sepay/webhook, /api/connections/..., /api/v1/..., /api/b/...) and now land on the api, not on Next.
    # The explicit priority makes this router win over the catch-all `web` router above; the path is forwarded unchanged.
    # The GraphQL endpoint (/graphql) and the probe aliases (/healthz; /health/live stays the web container's own) are the back end too, so the web app can call
    # its own origin (compatibility with the previous same-origin setup).
    api-paths:
      rule: (Host(`nivo.vn`) || Host(`www.nivo.vn`)) && (PathPrefix(`/api/`) || Path(`/graphql`) || Path(`/healthz`))
      priority: 100
      entryPoints: [websecure]
      service: api
      middlewares: [secure-headers]
      tls: { certResolver: le }
    # api.nivo.vn: the host of the API (GraphQL, public API, webhooks, OAuth callbacks). Its A record at Tino must point here before a certificate can be issued.
    api:
      rule: Host(`api.nivo.vn`)
      entryPoints: [websecure]
      service: api
      middlewares: [secure-headers]
      tls: { certResolver: le }
    # nguyentuannam.org (repo namnivo-lite): its own compose project ~/namnivo-web, reached as namnivo-web:3000 on the nivo-edge network.
    namnivo:
      rule: Host(`nguyentuannam.org`) || Host(`www.nguyentuannam.org`) || Host(`app.nguyentuannam.org`)
      entryPoints: [websecure]
      service: namnivo
      middlewares: [secure-headers]
      tls: { certResolver: le }
    # OPTIONAL, off: n8n is private (127.0.0.1:5678 on the VPS, reached through an SSH tunnel). To publish the editor, add the `n8n.nivo.vn` A record
    # at Tino, bind n8n to the bridge address in deploy/stack/docker-compose.yml, set its N8N_HOST / N8N_PROTOCOL / WEBHOOK_URL / N8N_SECURE_COOKIE,
    # then uncomment this router and the `n8n` service below.
    # n8n:
    #   rule: Host(`n8n.nivo.vn`)
    #   entryPoints: [websecure]
    #   service: n8n
    #   middlewares: [secure-headers]
    #   tls: { certResolver: le }

  services:
    web:
      loadBalancer:
        servers: [{ url: "http://nivo-web:3000" }]
    namnivo:
      loadBalancer:
        servers: [{ url: "http://namnivo-web:3000" }]
    # n8n:
    #   loadBalancer:
    #     servers: [{ url: "http://172.29.0.1:5678" }]
    # The api lives in OpenClaw's network namespace (the gateway honours declared scopes only for a loopback peer) and publishes
    # its port on the docker bridge address (API_BIND, default 172.29.0.1, see deploy/stack/docker-compose.yml). It listens on 8787.
    api:
      loadBalancer:
        servers: [{ url: "http://172.29.0.1:8787" }]
