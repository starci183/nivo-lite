schema: starci/i18n-dynamic-keys@1
# Catalog keys of fe/apps/web the R280 detector cannot see being read: built at run time from data, or read through a translator handed in
# from a block to a wrapper hook or typed callback. Each reason names the file that reads the key or builds the key family.
namespaces:
