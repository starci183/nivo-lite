      reason: "Key family built at run time as `${prefix}${code}` in hooks/admin/useAdminWorkspaceRows.ts: the billing status code comes from data, so the detector cannot enumerate the keys."
    - prefix: "planName_"
      reason: "Key family built at run time as `${prefix}${code}` in hooks/admin/useAdminWorkspaceRows.ts: the plan code comes from data, so the detector cannot enumerate the keys."
    - key: "failTitle"
      reason: 'Read as the string "failTitle" in components/blocks/AccountEmail/index.tsx, components/blocks/AccountPassword/index.tsx; the translator that reaches it is a wrapper hook or typed callback handed in from the block, whose namespace the detector does not bind.'
