  saveBrainFact(input: SaveBrainFactInput!): SavedFactType!
  saveBrainLesson(input: SaveBrainLessonInput!): BrainLessonType!
  setKnowledgeSuggestionState(input: SetKnowledgeSuggestionStateInput!): Boolean!
