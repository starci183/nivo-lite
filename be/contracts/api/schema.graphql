type Mutation {
  approveLeadGenComment(input: ApproveLeadGenCommentInput!): LeadGenCommentStatusType!
  createWorkspace(input: CreateWorkspaceInput!): CreateWorkspaceType!
  requestChatAnswer(input: RequestChatAnswerInput!): ChatReplyProgressType!
  requestChatReply(input: RequestChatReplyInput!): ChatReplyProgressType!
  setChatHandling(input: SetChatHandlingInput!): ChatHandlingType!
}

type PromoChatbotStateType {
  agentId: ID
  handle: String
  hasChatbot: Boolean!
  name: String
}

type PromoOnboardingStepType {
  done: Boolean!
  href: String!
  key: String!
}

type PromoStateType {
  chatbotAgentId: ID
  hasChatbot: Boolean!
  isFoundingMember: Boolean!
  onboarding: [PromoOnboardingStepType!]!
  websiteLeadStats: WebsiteLeadStatsType!
}

type Query {
  chatAnswerStatus(input: ChatAnswerStatusInput!): ChatReplyProgressType!
  chatReplyStatus(input: ChatReplyStatusInput!): ChatReplyProgressType!
  chatbotGaps: ChatbotGapsType!
  chatbotOverview(input: ChatbotOverviewInput!): ChatbotOverviewType!
  chatbotThread(input: ChatbotThreadInput!): ChatbotThreadType!
  foundingMember: Boolean!
  leadGenCommentStatus(input: ReadLeadGenCommentStatusInput!): LeadGenCommentStatusType!
  leadGenWorkbench(input: ReadLeadGenWorkbenchInput!): LeadGenWorkbenchType!
  leadWait(input: LeadWaitInput!): LeadWaitType!
  myWorkspaces: [MembershipType!]!
  promoChatbotState: PromoChatbotStateType!
  promoState: PromoStateType!
}

