# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --execute".
# Builds every image the app declares, once per commit, and pushes the deployed ones to GHCR. ci.yml calls it next to the checks, so the images
# are built in parallel with them and a Dockerfile that no longer builds fails the same run. It has no trigger of its own.
#   tags       sha-<sha> on every push; the release tag v<version> is added on a release run by retagging that digest (no rebuild), so the
#              image the checks ran beside is the image that ships. No mutable environment tag is ever written or deployed.
#   evidence   an SBOM and provenance (mode=max) are attached to the pushed digest; a build that is not pushed only proves the Dockerfile builds.
#   values     build arguments are public values (the browser receives them); a secret never enters an image build.
#   sealed     an image whose public build values live in a sealed member is built by the job bound to the release environment, on a release
#              tag run only (that environment is restricted to v* tags); every other image builds without an environment or a secret.
# The workflow is read by anyone when the repository is public: it runs on GitHub-hosted runners only, and nothing it prints names a host.
name: images

on:
  workflow_call:
    inputs:
      push:
        description: Push the deployed images (a push run); a pull request or a manual run only builds them
        required: true
        type: boolean
      release:
        description: A release tag run - also tag the pushed images v<version> and build the images that open sealed build values
        required: true
        type: boolean
    outputs:
      refs:
        description: JSON object, service -> repository@sha256:digest of the images this run pushed
        value: ${{ jobs.collect.outputs.refs }}

permissions:
  contents: read

jobs:
  image:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: be/apps/api/Dockerfile
            deployed: true
            args: false
          - name: cli
            file: be/apps/cli/Dockerfile
            deployed: false
            args: false
          - name: mcp
            file: be/apps/mcp/Dockerfile
            deployed: true
            args: false
          - name: web
            file: fe/apps/web/Dockerfile
            deployed: true
            args: true
          - name: landing
            file: fe/apps/landing/Dockerfile
            deployed: true
            args: true
          - name: db
            file: .starcistacks/images/db/Dockerfile
            deployed: true
            args: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release tag matches package version
        if: ${{ inputs.release }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || exit 1
          node -e "const version=require('./package.json').version;if(process.env.GITHUB_REF_NAME!=='v'+version)process.exit(1)"
      - name: image repository
        id: names
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=ghcr.io/${owner}/nivo-lite-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.args }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: ${{ matrix.args }}
      - name: public build values
        id: args
        if: ${{ matrix.args }}
        env:
          IMAGE_APP: ${{ matrix.name }}
        run: npx --no-install starci app stack build-args --env production --app "$IMAGE_APP"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ steps.args.outputs.args }}
          platforms: linux/amd64
          push: ${{ inputs.push && matrix.deployed }}
          tags: ${{ steps.names.outputs.repo }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: tag the release
        if: ${{ inputs.release && inputs.push && matrix.deployed }}
        shell: bash
        env:
          REPO: ${{ steps.names.outputs.repo }}
        run: docker buildx imagetools create --tag "$REPO:$GITHUB_REF_NAME" "$REPO:sha-$GITHUB_SHA"

  collect:
    needs: [image]
    if: ${{ !cancelled() && inputs.push && needs.image.result == 'success' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: pushed digests
        id: refs
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          refs='{}'
          while read -r service app sealed; do
            if [[ "$sealed" == true && "$RELEASE" != true ]]; then continue; fi
            repo="ghcr.io/${owner}/nivo-lite-${app}"
            digest=$(docker buildx imagetools inspect "$repo:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no pushed digest for the image of ${service}"; exit 1; }
            refs=$(jq -c --arg service "$service" --arg ref "$repo@$digest" '. + {($service): $ref}' <<<"$refs")
          done <<'LIST'
          nivo-api api false
          nivo-mcp mcp false
          nivo-web-app web false
          nivo-landing landing false
          db db false
          LIST
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
