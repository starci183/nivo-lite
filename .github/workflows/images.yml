# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --write".
# Builds each image declared by the lite app. The API image is required; a front-end image is emitted only when declared.
# It runs on the release tag, so every image is built there, and never pushes.
name: images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per ref.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: production
    env:
      STACK_ENVIRONMENT: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: be/apps/api/Dockerfile
          - name: cli
            file: be/apps/cli/Dockerfile
          - name: web
            file: fe/apps/web/Dockerfile
          - name: landing
            file: fe/apps/landing/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release tag matches package version
        run: node -e "const version=require('./package.json').version;if(process.env.GITHUB_REF_NAME!=='v'+version)process.exit(1)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ (env.STACK_ENVIRONMENT == 'production' && contains(fromJSON('["api","web","landing"]'), matrix.name)) }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: ${{ (env.STACK_ENVIRONMENT == 'production' && contains(fromJSON('["api","web","landing"]'), matrix.name)) }}
      - name: install SOPS
        if: ${{ (env.STACK_ENVIRONMENT == 'production' && contains(fromJSON('["api","web","landing"]'), matrix.name)) }}
        uses: mdgreenwald/mozilla-sops-action@d180aee439b894360c10dde0652df5d0fe0210dc # v2.1.2
        with:
          version: v3.13.2
      - name: public build values
        id: args
        if: ${{ (env.STACK_ENVIRONMENT == 'production' && contains(fromJSON('["api","web","landing"]'), matrix.name)) }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          IMAGE_APP: ${{ matrix.name }}
        run: npx --no-install starci app stack build-args --env "$STACK_ENVIRONMENT" --app "$IMAGE_APP"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ steps.args.outputs.args }}
          push: false
          tags: nivo-lite/${{ matrix.name }}:${{ github.ref_name }}
          # OCI keeps the SBOM and provenance attestations without publishing to a registry.
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.name }}.oci.tar
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: retain image with SBOM and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.name }}.oci.tar
          if-no-files-found: error
          compression-level: 0
