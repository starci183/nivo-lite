# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --execute".
name: ci

# CI judges pull requests, main, release candidates and release tags, and a green release tag deploys.
#   pull_request  the checks and the image builds of a change to main, with no secret and no environment (a Dependabot or fork run has none anyway);
#                 and no run of this workflow executes a pull request's code with a token that can write
#   main          judged only when no release tag points at the pushed commit (the release push sends main and its tag together; the tag run is the release run)
#   candidate     release/candidate-<version>: the full run of a release the tag run then reuses
#   tag v*        the release run: plan, checks and images in parallel, the verdict, then the deploy of every environment with deploy.auto
on:
  push:
    branches: ["main", "release/candidate-*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# The committed check cache (.starcistacks/cache, contexts/project/check-cache.md): a run judges only what differs from the cache at its trusted base
# (the first parent of a push to main). A release candidate and a release tag judge in full and never read the cache.
env:
  STARCI_APP_CHECK_CACHE: ${{ (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/candidate-')) && 'full' || '' }}

# One run per ref. A pull request run is replaced by the next push to it; every other run, a release tag above all, is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job shape of the StarCi CI standard (knowledge/hfs/ci-standard.yaml): plan, fast, lint per side, the unit run in shards, one coverage merge, build, images,
# sonar, the verdict and the deploy jobs. Timeouts and the shard count come from ci.jobs of .starcistacks/application-stacks.yaml (defaults in the standard).
# A job the plan leaves out is never a green one: the verdict job requires every job it needs to be green or, where the plan left it out on purpose, not run.
jobs:
  plan:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      images: ${{ steps.plan.outputs.images }}
      push: ${{ steps.plan.outputs.push }}
      full: ${{ steps.plan.outputs.full }}
      release: ${{ steps.plan.outputs.release }}
      ci_run: ${{ steps.plan.outputs.ci_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          checks=true images=true push=false full=false release=false ci_run="$GITHUB_RUN_ID" note="checks and image builds"
          if [[ "$EVENT" == push ]]; then
            full=true push=true
            if [[ "$REF_TYPE" == tag ]]; then
              release=true
              [[ "$GITHUB_REF_NAME" == "v$(node -p "require('./package.json').version")" ]] || { echo "::error::the release tag does not match the package version"; exit 1; }
              reused=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=100" --jq '[.workflow_runs[] | select(.head_branch | startswith("release/candidate-"))] | first | .id // empty')
              if [[ -n "$reused" ]]; then checks=false ci_run="$reused" note="release run: the green candidate run $reused judged this commit; images are built and pushed here"; else note="release run: full checks and images"; fi
            elif [[ "$GITHUB_REF" == refs/heads/release/candidate-* ]]; then
              note="candidate run: full checks; images are built and pushed under sha-<sha>"
            elif [[ -n "$(git tag --points-at "$GITHUB_SHA" --list 'v*')" ]]; then
              checks=false images=false push=false full=false note="deferred: the release tag run of this commit judges it"
            else
              images=false push=false full=false note="main without a release tag: checks only"
            fi
          fi
          { echo "checks=$checks"; echo "images=$images"; echo "push=$push"; echo "full=$full"; echo "release=$release"; echo "ci_run=$ci_run"; } >> "$GITHUB_OUTPUT"
          echo "plan: $note" >> "$GITHUB_STEP_SUMMARY"

  fast:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: format
        run: npx --no-install starci app check --format
      - name: typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  lint:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: [be, fe]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: lint baseline
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="origin/$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="origin/$BASE_BRANCH"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            base=$(git describe --tags --abbrev=0 "$GITHUB_REF^" 2>/dev/null) || base="origin/$DEFAULT_BRANCH"
          elif [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          fi
          echo "STARCI_BASE_REF=$base" >> "$GITHUB_ENV"
      - name: lint with Sonar import
        run: npm run lint -- --side ${{ matrix.side }} --out reports/lint.${{ matrix.side }}.sonar.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles(format('reports/lint.{0}.sonar.json', matrix.side)) != ''
        with:
          name: sonar-lint-${{ matrix.side }}
          path: reports/lint.${{ matrix.side }}.sonar.json

  test:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: Jest cache restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-
            ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-
      # A shard (STARCI_COVERAGE_SHARD=1, the jest preset) measures only the files its specs load, without the per-file threshold, and writes istanbul
      # JSON; the coverage job merges the shards by source location and proves 100 per file on the merged report. The shard count never exceeds what the unit specs fill.
      - name: unit
        run: npm test -- --ci --forceExit --cacheDirectory .jest-cache --shard=${{ matrix.shard }}/6
        env:
          STARCI_COVERAGE_SHARD: "1"
      - name: Jest cache save
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .jest-cache
          key: ${{ runner.os }}-node22-jest-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('be/coverage/coverage-final.json') != ''
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: be/coverage/coverage-final.json

  coverage:
    needs: [plan, test]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Codecov OIDC authentication requires a job-scoped identity token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: be/coverage/shards
      - name: merge coverage
        run: npx --no-install starci app coverage merge --out be/coverage/lcov.info be/coverage/shards
      - name: coverage proof
        run: npx starci app coverage verify be/coverage/lcov.info
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('be/coverage/lcov.info') != ''
        with:
          name: coverage-lcov
          path: be/coverage/lcov.info
      - name: coverage upload
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
        with:
          use_oidc: true
          files: be/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  build:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: build be
        run: npm run build:be
      - name: build fe web
        run: npm run codegen --silent && npx --no-install turbo run build --filter=./fe/apps/web
        env:
          NEXT_PUBLIC_API_URL: "https://api.nivo.vn"
          NEXT_PUBLIC_APP_URL: "https://app.nivo.vn"
          NEXT_PUBLIC_DEVELOPER_API_URL: "https://api.nivo.vn"
          NEXT_PUBLIC_LANDING_URL: "https://nivo.vn"
          NEXT_PUBLIC_SITE_URL: "https://app.nivo.vn"
      - name: build fe landing
        run: npm run codegen --silent && npx --no-install turbo run build --filter=./fe/apps/landing
        env:
          NEXT_PUBLIC_APP_URL: "https://app.nivo.vn"
          NEXT_PUBLIC_SITE_URL: "https://nivo.vn"
      - name: build cache save
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
      - name: database migration checks
        run: npm run db:lint && npx starci app db drift
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  sonar:
    needs: [plan, lint, coverage]
    if: ${{ needs.plan.outputs.full == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: Sonar token
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "::error::SONAR_TOKEN is not set: Sonar is required, so a missing token fails this job (secret SONAR_TOKEN)"; exit 1; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
        with:
          name: coverage-lcov
          path: be/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
        with:
          pattern: sonar-lint-*
          path: reports
          merge-multiple: true
      - name: merge Sonar lint reports
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['reports/lint.be.sonar.json', 'reports/lint.fe.sonar.json'];
          const reports = files.filter(file => fs.existsSync(file)).map(file => JSON.parse(fs.readFileSync(file, 'utf8')));
          const rules = [...new Map(reports.flatMap(report => report.rules).map(rule => [rule.id, rule])).values()];
          const issues = reports.flatMap(report => report.issues);
          fs.mkdirSync('reports', { recursive: true });
          fs.writeFileSync('reports/lint.sonar.json', JSON.stringify({ rules, issues }, null, 2) + '\n');
          NODE
      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
        timeout-minutes: 10

  images:
    needs: plan
    if: ${{ needs.plan.outputs.images == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ needs.plan.outputs.push == 'true' }}
      release: ${{ needs.plan.outputs.release == 'true' }}

  verdict:
    needs: [plan, fast, lint, test, coverage, build, images, sonar]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: verdict
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          CHECKS: ${{ needs.plan.outputs.checks }}
          IMAGES: ${{ needs.plan.outputs.images }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          fail=0
          expect() {
            got=$(jq -r --arg job "$1" '.[$job].result' <<<"$NEEDS")
            case "$2" in
              success) [[ "$got" == success ]] || { echo "::error::job $1 is $got, expected success"; fail=1; } ;;
              idle) [[ "$got" != success && "$got" != failure && "$got" != cancelled ]] || { echo "::error::job $1 ran ($got) where the plan left it out"; fail=1; } ;;
            esac
          }
          expect plan success
          if [[ "$CHECKS" == true ]]; then want=success; else want=idle; fi
          for job in fast lint test coverage build; do expect "$job" "$want"; done
          if [[ "$IMAGES" == true ]]; then expect images success; else expect images idle; fi
          if [[ "$FULL" == true && "$CHECKS" == true ]]; then expect sonar success; else expect sonar idle; fi
          exit "$fail"

  deploy-production:
    needs: [plan, verdict, images]
    if: ${{ needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      packages: read
      actions: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/stack-deploy.yml
    with:
      environment: production
      operation: deploy
      auto: true
      images: ${{ needs.images.outputs.refs }}
      ci_run: ${{ needs.plan.outputs.ci_run }}
