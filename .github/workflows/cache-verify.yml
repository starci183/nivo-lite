# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --execute".
# The verify of the committed check cache (contexts/project/check-cache.md, "The verify of the cache"). The release gate and every CI run trust the warm cache; this
# workflow proves that trust. It is sharded the way ci.yml is: one job per family, each `starci app check --env prod --fresh --gate <family>` (the lint family once per
# side), so no job takes the time of a whole fresh run. A job recomputes its family from scratch and fails when the committed records are not the ones it produced
# (HFS_CHECK_CACHE_UNWARMED); the verdict job is green only when every shard is. It runs every night on the default branch, and on dispatch on any branch for that
# branch's head: a green run for the sha of a release clears HFS_CHECK_CACHE_VERIFY_LOCKED for that sha, and a newer red run on the default branch locks it again.
name: cache verify

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a dispatch on dev never waits for the night run of main, and a run is never cancelled.
concurrency:
  group: cache-verify-${{ github.ref }}
  cancel-in-progress: false

env:
  STARCI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - "--gate hfs"
          - "--gate secrets"
          - "--gate format"
          - "--gate db"
          - "--gate wiring"
          - "--gate types"
          - "--gate test"
          - "--gate build"
          - "--gate lint --side be"
          - "--gate lint --side fe"
          - "--gate lint --side packages"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: build the workspace packages
        run: npm run build:modules --silent
      - name: build the lint inputs
        if: ${{ startsWith(matrix.args, '--gate lint') }}
        run: npm run build:modules --silent && npm run codegen --silent && npx --no-install turbo run build --filter=./fe/packages/*
      - name: verify the committed cache
        run: npx --no-install starci app check --env prod --fresh ${{ matrix.args }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: the committed records are the ones this family wrote
        shell: bash
        run: |
          changed=$(git status --porcelain --untracked-files=all -- .starcistacks/cache)
          if [[ -n "$changed" ]]; then
            echo "::error::HFS_CHECK_CACHE_UNWARMED: a fresh run of ${{ matrix.args }} wrote records other than the committed ones"
            echo "$changed" | head -20
            exit 1
          fi

  verdict:
    needs: [verify]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: verdict
        shell: bash
        env:
          VERIFY: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          [[ "$VERIFY" == success ]] || { echo "::error::the cache verify is $VERIFY: a shard was red, or did not run"; exit 1; }
