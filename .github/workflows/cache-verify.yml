# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --execute".
# The nightly verify of the committed check cache (contexts/project/check-cache.md, "The nightly verify"; ruling release-gate-warm-cache). The release
# gate and every CI run trust the warm cache; this run proves that trust on the default branch: `STARCI_APP_CHECK_CACHE=verify` judges every family
# diff-only against the cache main's CI verified, then in full, and compares. Any difference fails the run naming the family and the record, and a
# failed run locks `starci app release gate` (HFS_CHECK_CACHE_VERIFY_LOCKED) until a green run of this workflow, scheduled or dispatched, clears it.
name: cache verify

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-verify
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: build the workspace packages
        run: npm run build:modules --silent
      - name: verify the committed cache
        run: npx --no-install starci app check
        env:
          STARCI_APP_CHECK_CACHE: verify
          STARCI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
