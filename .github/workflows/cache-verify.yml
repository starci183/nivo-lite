# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --execute".
# The nightly verify of the committed check cache (contexts/project/check-cache.md, "The nightly verify"). The release gate and every CI run trust the
# warm cache; this run proves that trust on the default branch: `starci app check --env prod --fresh` recomputes every family from scratch and the run fails
# (HFS_CHECK_CACHE_UNWARMED) when the committed records are not the ones it produced. A failed run locks `starci app release gate`
# (HFS_CHECK_CACHE_VERIFY_LOCKED) until a green run of this workflow, scheduled or dispatched, clears it.
name: cache verify

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-verify
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: deps
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
      # The build cache is restored in every job and saved by the build job always (build-cache-save.yml), keyed by the lockfile and the run.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .turbo
            fe/apps/*/.next/cache
          key: ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node22-build-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node22-build-
      - run: npm ci --ignore-scripts
        if: steps.deps.outputs.cache-hit != 'true'
      - name: build the workspace packages
        run: npm run build:modules --silent
      - name: verify the committed cache
        run: npx --no-install starci app check --env prod --fresh
        env:
          STARCI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
