# Builds the Next.js app image (fe/apps/web/Dockerfile, context = the repository root) on the GitHub runner (the VPS only runs it) and
# ships it to the NIVO VPS: docker save | gzip | ssh docker load.
# Lite cutover: this workflow runs by hand only (Actions > Deploy web > Run workflow), LAST in the order edge -> api -> web
# (be/docs/runbooks/cutover.md). It has no push trigger, so merging the conversion branch deploys nothing by itself; once the cutover
# is done a push trigger on the release branch can be restored here.
# Environment "production" (protect it with required reviewers):
#   vars    VPS_HOST, VPS_USER
#   secrets VPS_SSH_KEY, VPS_KNOWN_HOSTS (as for the api), SOPS_AGE_KEY (reads the two public build values from the sealed `web` member:
#           NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY; deploy/materialize.mjs public)
#   vars    NEXT_PUBLIC_API_URL (optional, default https://nivo.vn): the origin the browser calls for GraphQL (same origin as the site; the edge
#           routes /graphql to the api; api.nivo.vn has no DNS)
#           NEXT_PUBLIC_DEVELOPER_API_URL (optional, default https://nivo.vn): the public API host the Developers page shows (the web app never calls it)
# The web app has no runtime secret and no env file: its values are public build arguments baked into the image.
# Only ~/nivo-web and the "nivo-web" compose project are touched.
name: Deploy web

on:
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install sops (built from source; the Go module checksum database verifies it)
        run: |
          go install github.com/getsops/sops/v3/cmd/sops@v3.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Read the public build values from the sealed web member
        id: public
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          values="$(node deploy/materialize.mjs public --env production)"
          while IFS='=' read -r key value; do echo "::add-mask::$value"; done <<< "$values"
          { echo 'args<<PUBLIC_ARGS_END'; printf '%s\n' "$values"; echo 'PUBLIC_ARGS_END'; } >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: fe/apps/web/Dockerfile
          load: true
          tags: nivo-web:${{ github.sha }}
          build-args: |
            ${{ steps.public.outputs.args }}
            NEXT_PUBLIC_SITE_URL=https://nivo.vn
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://nivo.vn' }}
            NEXT_PUBLIC_DEVELOPER_API_URL=${{ vars.NEXT_PUBLIC_DEVELOPER_API_URL || 'https://nivo.vn' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH setup
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF2
          Host vps
            HostName ${{ vars.VPS_HOST }}
            User ${{ vars.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF2

      - name: Ship the image and the compose file
        run: |
          ssh vps 'mkdir -p ~/nivo-web'
          docker save "nivo-web:$TAG" | gzip | ssh vps 'gunzip | docker load'
          scp deploy/web/docker-compose.yml deploy/web/remote-deploy.sh vps:nivo-web/

      - name: Start, health-check, roll back if unhealthy
        run: ssh vps "bash ~/nivo-web/remote-deploy.sh $TAG"
