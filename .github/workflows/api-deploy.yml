# Deploys the api (the Nest back end, be/apps/api) and its stack (OpenClaw + n8n) on the NIVO VPS with Docker Compose. Background jobs run on
# Supabase Queues (pgmq) inside the api. The image is built on the GitHub runner (the VPS only runs it) and shipped: docker save | gzip | ssh docker load.
# Lite cutover: this workflow replaces "Deploy engine" and runs by hand only (Actions > Deploy api > Run workflow), SECOND in the order of
# be/docs/runbooks/cutover.md (api, then edge, then web). It has no push trigger, so merging the conversion branch deploys nothing by itself.
# Everything comes from the GitHub environment "production" (protect it with required reviewers):
#   vars    VPS_HOST, VPS_USER
#   secrets VPS_SSH_KEY (CI-only deploy key), VPS_KNOWN_HOSTS (pinned host keys),
#           SOPS_AGE_KEY (the age identity of .sops.yaml; the ONLY way application secrets reach the job).
# Secret custody: the sealed files under .starcistacks/production/secrets are decrypted in this job by deploy/materialize.mjs (plain sops until the
# canon repin, then `starci app secret materialize`), shipped as one file per key to ~/nivo-engine/deploy/secrets and read by the containers through
# `<NAME>_FILE` (deploy/stack/docker-compose.yml). No dotenv blob is stored in GitHub; nothing secret is baked into an image or into a rendered
# compose environment. The non-secret config is deploy/stack/api-public.conf (committed) and the stack settings of the sealed `stack` member.
# Rollback: the previous release folder is kept as ~/nivo-engine.prev and its image tag stays on the host; an unhealthy deploy restores both.
# A deploy never removes volumes (no "down -v", no volume prune).
# This workflow only touches ~/nivo-engine and the "nivo-engine" compose project (the project name is kept so the volumes keep their names).
name: Deploy api

on:
  workflow_dispatch:

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: be/apps/api/Dockerfile
          load: true
          tags: nivo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install sops (built from source; the Go module checksum database verifies it)
        run: |
          go install github.com/getsops/sops/v3/cmd/sops@v3.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Materialize the sealed secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          umask 077
          node deploy/materialize.mjs files --env production --out "$RUNNER_TEMP/materialized"

      - name: SSH setup
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ vars.VPS_HOST }}
            User ${{ vars.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF

      - name: Ship the image, the stack files and the secret files
        run: |
          docker save "nivo-api:$TAG" | gzip | ssh vps 'gunzip | docker load'
          tar -C deploy/stack -czf - . \
            | ssh vps 'set -e; rm -rf ~/nivo-engine.new; mkdir -p ~/nivo-engine.new/deploy; tar -xzf - -C ~/nivo-engine.new/deploy'
          # one file per secret (api/, stack/), the generated `<KEY>_FILE` pointers (api.env) and OpenClaw's own environment file
          tar -C "$RUNNER_TEMP/materialized" -czf - api stack api.env openclaw.env \
            | ssh vps 'set -e; cd ~/nivo-engine.new/deploy; mkdir -p secrets; tar -xzf - -C secrets; mv secrets/api.env secrets/openclaw.env .; chmod 600 openclaw.env; chmod 711 secrets'
          { cat "$RUNNER_TEMP/materialized/stack.env"; printf 'API_TAG=%s\n' "$TAG"; } | ssh vps 'umask 077; cat > ~/nivo-engine.new/deploy/.env'

      - name: Swap, restart, health check, roll back if unhealthy
        run: |
          ssh vps 'bash -s' <<'EOF'
          set -uo pipefail
          prev_tag() { grep -m1 '^API_TAG=' "$1/deploy/.env" 2>/dev/null | cut -d= -f2-; }
          PREV_TAG=$(prev_tag ~/nivo-engine)
          rm -rf ~/nivo-engine.prev
          [ -d ~/nivo-engine ] && mv ~/nivo-engine ~/nivo-engine.prev
          mv ~/nivo-engine.new ~/nivo-engine

          # Healthy = the api container is healthy (the image HEALTHCHECK probes /health/live) AND /readyz answers 200 inside it.
          wait_healthy() {
            local state=missing c="${2:-nivo-engine-api-1}"
            cd "$1/deploy" || return 1
            for _ in $(seq 1 36); do
              state=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
              if [ "$state" = healthy ] \
                && docker exec "$c" node -e "fetch('http://127.0.0.1:'+(process.env.PORT||process.env.ENGINE_PORT||8787)+'/readyz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            echo "$c not healthy (last container state: $state)"; return 1
          }
          start() {
            cd "$1/deploy" || return 1
            docker compose --env-file .env config -q || return 1
            docker compose --env-file .env up -d --remove-orphans
          }

          if start ~/nivo-engine && wait_healthy ~/nivo-engine; then
            echo "api healthy"; (cd ~/nivo-engine/deploy && docker compose --env-file .env ps --format 'table {{.Service}}\t{{.Status}}')
            # the previous release keeps its settings but not its plaintext secret files (a redeploy materializes them again)
            rm -rf ~/nivo-engine.prev/deploy/secrets ~/nivo-engine.prev/deploy/openclaw.env
            # keep the current and the previous image only
            NEW_TAG=$(prev_tag ~/nivo-engine)
            docker image ls nivo-api --format '{{.Tag}}' | grep -vxF -e "$NEW_TAG" -e "${PREV_TAG:-__none__}" | xargs -r -I{} docker rmi nivo-api:{} >/dev/null 2>&1 || true
            docker image prune -f >/dev/null
            # Watchdog: keeps the network_mode coupling (the api lives in the openclaw network namespace) and alerts on the job backlog (failed / stale jobs).
            # Every minute from the nivo user crontab, installed idempotently.
            chmod +x ~/nivo-engine/deploy/*.sh
            { crontab -l 2>/dev/null | grep -v "nivo-engine-watchdog" || true; echo "* * * * * $HOME/nivo-engine/deploy/watchdog.sh # nivo-engine-watchdog"; } | crontab -
            exit 0
          fi

          (cd ~/nivo-engine/deploy && docker compose --env-file .env logs --tail 80 api openclaw) 2>/dev/null || true
          if [ -d ~/nivo-engine.prev ]; then
            echo "ROLLING BACK to the previous release (~/nivo-engine.prev)"
            rm -rf ~/nivo-engine.failed; mv ~/nivo-engine ~/nivo-engine.failed; mv ~/nivo-engine.prev ~/nivo-engine
            rm -rf ~/nivo-engine.failed/deploy/secrets ~/nivo-engine.failed/deploy/openclaw.env
            # The release before the lite cutover is the engine stack: it builds its own image from its source tree and its service is "engine".
            svc=api; c=nivo-engine-api-1
            if grep -q '^  engine:' ~/nivo-engine/deploy/docker-compose.yml 2>/dev/null; then
              svc=engine; c=nivo-engine-engine-1
              (cd ~/nivo-engine/deploy && docker compose --env-file .env build engine) || true
            fi
            if start ~/nivo-engine && wait_healthy ~/nivo-engine "$c"; then echo "rollback healthy ($svc)"; else echo "ROLLBACK ALSO UNHEALTHY ($svc): follow be/docs/runbooks/cutover.md, Rollback"; fi
          else
            echo "no previous release to roll back to"
          fi
          exit 1
          EOF

      - name: Remove the materialized secrets from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/materialized"
