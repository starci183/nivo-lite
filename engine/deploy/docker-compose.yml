# NIVO engine stack for ONE Ubuntu VPS: caddy (TLS, the only public door) + engine + openclaw + n8n (+ its own postgres).
# Read deploy/README.md first. Run from this folder:  docker compose --env-file .env up -d --build
#
# Network layout (this is deliberate):
#   caddy      publishes 80/443. Everything else is private to the compose network.
#   openclaw   OpenClaw gateway, raw WebSocket on 18789. Published ONLY on 127.0.0.1 (reach it with an SSH tunnel for its Control UI).
#   engine     network_mode: service:openclaw  -> it shares openclaw network namespace, so it reaches the gateway on 127.0.0.1:18789.
#              That is not a convenience: the gateway honours the scopes a client declares ONLY for a loopback peer using a shared
#              secret (docs/OPENCLAW-GATEWAY-PROTOCOL.md in nivo-backend). From any other address the scopes are cleared and
#              sessions.send is refused. Consequences: the engine listens inside openclaw namespace (caddy reaches it as openclaw:8787),
#              and recreating openclaw recreates the engine too (compose does this for you).
#   n8n        behind caddy at n8n.<domain>; talks to its own postgres (n8n-db).

name: nivo-engine

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    # Optional public door. Off by default (profile "public"): on a host where another ingress already owns 80/443
    # (k3s Traefik on the NIVO VPS) the stack runs without it; the engine needs no inbound port at all.
    profiles: ["public"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      N8N_ALLOWED_CIDRS: ${N8N_ALLOWED_CIDRS:-0.0.0.0/0 ::/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - n8n
      - openclaw
    logging: *logging

  openclaw-init:
    # Writes the gateway settings the stack relies on into openclaw.json before the gateway starts (idempotent merge: other
    # keys, agents and plugins OpenClaw or an operator added are kept). Loopback bind + token auth: only the engine, which
    # shares the gateway's network namespace, can reach it.
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw}:${OPENCLAW_TAG:-2026.7.1}
    restart: "no"
    entrypoint: ["node", "-e"]
    command:
      - |
        const fs = require("fs"), p = "/home/node/.openclaw/openclaw.json";
        let c = {}; try { c = JSON.parse(fs.readFileSync(p, "utf8")); } catch {}
        c.agents = c.agents || {}; c.agents.defaults = { ...(c.agents.defaults || {}), skipBootstrap: true }; // the engine writes each agent workspace itself (openclaw.sync_agent): no first-run ritual
        c.gateway = { ...(c.gateway || {}), mode: "local", bind: "loopback", port: 18789,
          auth: { ...((c.gateway || {}).auth || {}), mode: "token", token: process.env.OPENCLAW_GATEWAY_TOKEN } };
        const model = process.env.OPENCLAW_MODEL;
        if (model) { c.agents = c.agents || {}; c.agents.defaults = c.agents.defaults || {};
          c.agents.defaults.model = { ...(c.agents.defaults.model || {}), primary: model }; }
        fs.mkdirSync("/home/node/.openclaw", { recursive: true });
        fs.writeFileSync(p, JSON.stringify(c, null, 2), { mode: 0o600 });
        console.log("openclaw.json ready (gateway local/loopback/token" + (model ? ", model " + model : "") + ")");
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openrouter/deepseek/deepseek-v4-flash}
    volumes:
      - openclaw-data:/home/node/.openclaw
    logging: *logging

  openclaw:
    # Same image family nivo-backend provisions (AGENTOS_IMAGE_OPENCLAW_REPOSITORY). Pin a tag you have tested; the protocol document
    # was measured against 2026.7.1. VERIFY the default start command of your tag (docker run --rm <image> --help) before first deploy.
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw}:${OPENCLAW_TAG:-2026.7.1}
    restart: unless-stopped
    environment:
      # Gateway credential: the engine presents the same value (OPENCLAW_GATEWAY_TOKEN below).
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      # Model provider keys: set whichever provider your OpenClaw agents are configured for (empty ones are ignored).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    # The engine lives in this network namespace, so its port is published here. Bind to the Docker bridge address
    # (ENGINE_BIND=172.29.0.1) to let k3s Traefik reach it; the k3s Ingress only routes the exact path /healthz.
    ports:
      - "${ENGINE_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - openclaw-data:/home/node/.openclaw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  engine:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nivo-engine:${ENGINE_VERSION:-latest}
    restart: unless-stopped
    network_mode: "service:openclaw"
    depends_on:
      openclaw:
        condition: service_healthy
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
      NIVO_BASE_URL: ${NIVO_BASE_URL:?set NIVO_BASE_URL in .env}
      ENGINE_SHARED_SECRET: ${ENGINE_SHARED_SECRET:?set ENGINE_SHARED_SECRET in .env}
      ENGINE_WORKER_ID: ${ENGINE_WORKER_ID:-vps-1}
      ENGINE_HOST: 0.0.0.0
      ENGINE_PORT: "8787"
      ENGINE_CONCURRENCY: ${ENGINE_CONCURRENCY:-4}
      ENGINE_POLL_MS: ${ENGINE_POLL_MS:-2000}
      ENGINE_LEASE_SECONDS: ${ENGINE_LEASE_SECONDS:-60}
      ENGINE_SHUTDOWN_GRACE_MS: ${ENGINE_SHUTDOWN_GRACE_MS:-30000}
      OPENCLAW_GATEWAY_URL: ws://127.0.0.1:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_TURN_TIMEOUT_MS: ${OPENCLAW_TURN_TIMEOUT_MS:-90000}
      OPENCLAW_MANAGE_AGENTS: ${OPENCLAW_MANAGE_AGENTS:-1}
      OPENCLAW_CONFIG_DIR: /openclaw-state
      OPENCLAW_GATEWAY_STATE_DIR: /home/node/.openclaw
      N8N_DEFAULT_WEBHOOK_URL: ${N8N_DEFAULT_WEBHOOK_URL:-}
      N8N_ALLOWED_HOSTS: ${N8N_ALLOWED_HOSTS:-n8n}
    volumes:
      - openclaw-data:/openclaw-state
    stop_grace_period: 45s # longer than ENGINE_SHUTDOWN_GRACE_MS so running jobs can finish or be handed back
    logging: *logging

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  n8n:
    # Version nivo-backend pins (AGENTOS_IMAGE_N8N_TAG). Upgrade deliberately: n8n migrates its database on start.
    image: docker.n8n.io/n8nio/n8n:${N8N_TAG:-1.64.3}
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: "5678"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    # N8N_BIND=127.0.0.1 keeps it private (SSH tunnel); N8N_BIND=172.29.0.1 lets k3s Traefik serve it at https://n8n.nivo.vn.
    ports:
      - "${N8N_BIND:-127.0.0.1}:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  openclaw-data:
  n8n-data:
  n8n-db:
