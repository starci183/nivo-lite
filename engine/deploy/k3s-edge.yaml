# Public doors for the Docker stack through the k3s Traefik that already owns 80/443 on the NIVO VPS.
# Everything lives in its own namespace; nothing existing is modified. Remove it all with:
#   kubectl delete namespace nivo-lite-edge
# The Docker stack publishes n8n (5678) and the engine (8787) on the Docker bridge address 172.29.0.1 only
# (N8N_BIND / ENGINE_BIND in deploy/.env), which pods can reach and the internet cannot.
# Certificates come from the existing ClusterIssuer letsencrypt-prod (HTTP-01), so DNS must point at the VPS first:
#   n8n.nivo.vn, engine.nivo.vn  A  103.142.27.9
apiVersion: v1
kind: Namespace
metadata:
  name: nivo-lite-edge
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: nivo-lite-edge
spec:
  ports:
    - name: http
      port: 5678
      targetPort: 5678
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: n8n-docker
  namespace: nivo-lite-edge
  labels:
    kubernetes.io/service-name: n8n
addressType: IPv4
ports:
  - name: http
    port: 5678
    protocol: TCP
endpoints:
  - addresses: ["172.29.0.1"]
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  namespace: nivo-lite-edge
spec:
  ports:
    - name: http
      port: 8787
      targetPort: 8787
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: engine-docker
  namespace: nivo-lite-edge
  labels:
    kubernetes.io/service-name: engine
addressType: IPv4
ports:
  - name: http
    port: 8787
    protocol: TCP
endpoints:
  - addresses: ["172.29.0.1"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: nivo-lite-edge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["n8n.nivo.vn"]
      secretName: n8n-nivo-vn-tls
  rules:
    - host: n8n.nivo.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
---
# Only the liveness path of the engine is public. /tools (OpenClaw's tool bridge) and everything else stay unrouted.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: engine-health
  namespace: nivo-lite-edge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["engine.nivo.vn"]
      secretName: engine-nivo-vn-tls
  rules:
    - host: engine.nivo.vn
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: engine
                port:
                  number: 8787
